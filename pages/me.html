<script>
(function(){
  var emailEl = document.getElementById('userEmail');
  if(emailEl && BTCBOX.account.email) emailEl.textContent = BTCBOX.account.email;
  // 从服务器加载账户与余额；资产只展示真实返回的非零余额，不构造演示资产。
  function loadRealAccount(){
    if(!BTCBOX.isLoggedIn()) return;
    fetch('../api/account', {credentials:'include', cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(!j || !j.ok) return;
      var emailEl=document.getElementById('userEmail'); if(emailEl) emailEl.textContent=j.email||'--';
      var avatar=document.getElementById('userAvatar'); if(avatar) avatar.textContent=((j.email||'U').charAt(0)||'U').toUpperCase();
      var uidEl=document.getElementById('userUid'); if(uidEl) uidEl.textContent='UID: '+(j.uid||'--');
      var status=(j.kyc&&j.kyc.status)||'unsubmitted'; var badge=document.getElementById('kycBadge'); var statusEl=document.getElementById('kycStatus');
      var labels={approved:'✅ 已实名认证',pending:'⏳ 审核中',rejected:'❌ 未实名认证',unsubmitted:'❌ 未实名认证'};
      if(badge) badge.textContent=labels[status]||'❌ 未实名认证'; if(statusEl) statusEl.textContent=labels[status]||'❌ 未实名认证';
      var total=Number(j.totalUsdt!=null?j.totalUsdt:j.total_usdt); var totalEl=document.getElementById('totalAssetsUsdt'); if(totalEl) totalEl.textContent=Number.isFinite(total)?total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT':'-- USDT';
      var pnlKnown=Number.isFinite(Number(j.todayPnl)) && j.todayPnl!==null && j.todayPnl!==undefined; var pctKnown=Number.isFinite(Number(j.todayPnlPct)) && j.todayPnlPct!==null && j.todayPnlPct!==undefined; var pnl=Number(j.todayPnl), pct=Number(j.todayPnlPct); var pnlEl=document.getElementById('assetPnlUsdt'), pctEl=document.getElementById('assetPnlPct');
      if(pnlEl){pnlEl.textContent=pnlKnown?((pnl>=0?'+':'-')+Math.abs(pnl).toFixed(2)+' USDT'):'--';if(pnlKnown)pnlEl.style.color=pnl>=0?'var(--up)':'var(--down)';}
      if(pctEl){pctEl.textContent=pctKnown?((pct>=0?'+':'')+pct.toFixed(2)+'% '+(pct>=0?'↑':'↓')):'--';if(pctKnown)pctEl.style.color=pct>=0?'var(--up)':'var(--down)';}
      var rows=document.getElementById('myAssetRows'); if(rows){var balances=j.balances||{}; var keys=Object.keys(balances).filter(function(k){var b=balances[k]||{};return Number(b.amount!=null?b.amount:b.free||0)>0;});
        if(!keys.length){rows.innerHTML='<div style="padding:18px 0;text-align:center;color:var(--text-3);font-size:12px;">暂无有余额的资产</div>';}
        else {rows.innerHTML=keys.map(function(k){var b=balances[k]||{}, amount=Number(b.amount!=null?b.amount:b.free||0), usdtValue=Number(b.usdt||0);var fmt=amount.toLocaleString('en-US',{maximumFractionDigits:8});return '<div style="display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:6px;align-items:center;padding:12px 0;border-top:1px solid var(--border);font-size:12px;"><span style="font-weight:700;">'+String(k).replace(/[<>"']/g,'')+'</span><span class="num" style="text-align:right;">'+fmt+'</span><span class="num" style="text-align:right;">'+(Number.isFinite(usdtValue)?usdtValue.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT':'--')+'</span></div>';}).join('');}
      }
    }).catch(function(){});
  }
  loadRealAccount();
  document.addEventListener('accountChange', loadRealAccount);
  var logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', function(){
      BTCBOX.confirm({
        iconType: 'warning',
        title: '退出登录',
        bodyHtml: '确定要退出当前账号吗？退出后需重新登录才能查看资产与交易。',
        confirmText: '退出登录',
        cancelText: '取消'
      }).then(function(ok){
        if(!ok) return;
        BTCBOX.logout();
        BTCBOX.toast((window.I18N?I18N.t('logoutOk'):''), 'success');
        setTimeout(function(){ location.href = '../index.html'; }, 1000);
      });
    });
  }
})();
</script>
