<script src="../assets/js/market-api.js"></script>

<script src="../assets/js/app.js"></script>
<script>
(function(){
  var emailEl = document.getElementById('userEmail');
  if(emailEl && BTCBOX.account.email) emailEl.textContent = BTCBOX.account.email;
  // 加载真实账户数据（KYC状态、持有币种数）
  function loadRealAccount(){
    if(!BTCBOX.isLoggedIn()) return;
    fetch('../api/account', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok) return;
        // UID
        if(j.uid){ var uidEl = document.getElementById('userUid'); if(uidEl) uidEl.textContent = 'UID ' + j.uid; }
      // 立即从本地缓存读UID，不等接口
      try{
        var acc = JSON.parse(localStorage.getItem('btcbox_account')||'{}');
        if(acc.uid){ var ue = document.getElementById('userUid'); if(ue && ue.textContent==='UID --') ue.textContent = 'UID '+acc.uid; }
      }catch(e){}
        // KYC 状态
        var kycStatus = (j.kyc && j.kyc.status) || 'unsubmitted';
        var badge = document.getElementById('kycBadge');
        var statusText = document.getElementById('kycStatus');
        if(kycStatus === 'approved'){
          badge.textContent = '已认证';
          badge.style.background = 'var(--gold-soft)';
          badge.style.color = 'var(--gold)';
          if(statusText) statusText.textContent = '已完成高级认证';
        } else if(kycStatus === 'pending'){
          badge.textContent = '审核中';
          badge.style.background = 'rgba(240,185,11,.15)';
          badge.style.color = '#f0b90b';
          if(statusText) statusText.textContent = '认证审核中，请耐心等待';
        } else {
          badge.textContent = '未认证';
          badge.style.background = 'var(--bg-2)';
          badge.style.color = 'var(--text-3)';
          if(statusText) statusText.textContent = '未提交认证，点击前往';
        }
        // 持有币种数
        var holdCount = 0;
        if(j.balances){
          Object.keys(j.balances).forEach(function(sym){
            if((j.balances[sym].amount || 0) > 0) holdCount++;
          });
        }
        var holdEl = document.getElementById('holdCoins');
        if(holdEl) holdEl.textContent = holdCount;
        var openEl = document.getElementById('openOrders');
        if(openEl){
          var openCount = (j.orders||[]).filter(function(o){return o.status==='open'||o.status==='pending';}).length;
          openEl.textContent = openCount;
        }
      }).catch(function(){});
  }
  loadRealAccount();
  document.addEventListener('accountChange', loadRealAccount);
  var logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', function(){
      BTCBOX.confirm({
        iconType: 'warning',
        title: '退出登录',
        bodyHtml: '确定要退出当前账号吗？退出后需重新登录才能查看资产与交易。',
        confirmText: '退出登录',
        cancelText: '取消'
      }).then(function(ok){
        if(!ok) return;
        BTCBOX.logout();
        BTCBOX.toast((window.I18N?I18N.t('logoutOk'):''), 'success');
        setTimeout(function(){ location.href = '../index.html'; }, 1000);
      });
    });
  }
})();
</script>
