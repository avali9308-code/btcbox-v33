<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>提现 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="page-title">提现</span>
    </div>
    <a style="font-size:12px;color:var(--gold);font-weight:600;cursor:pointer;" onclick="document.getElementById('wdRecords').scrollIntoView({behavior:'smooth',block:'center'});">提现记录</a>
  </header>
  <div class="content">
    <div class="security-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
      提币前请确认地址正确，链上转账不可撤销
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div class="form-group">
        <label class="form-label">币种</label>
        <div id="wdCoinSelect" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;cursor:pointer;">
          <div class="coin-icon" style="background:#26a17b;width:32px;height:32px;font-size:10px;">USDT</div>
          <div style="flex:1;"><div style="font-size:14px;font-weight:700;" id="wdCoinName">USDT</div><div style="font-size:11px;color:var(--text-3);">可用 <span class="num" id="wdAvail">--</span> USDT</div></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5a6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">提币网络</label>
        <div style="display:flex;gap:8px;">
          <button class="net-btn active" data-net="TRC20" style="flex:1;padding:10px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;">TRC20</button>
          <button class="net-btn" data-net="ERC20" style="flex:1;padding:10px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:600;">ERC20</button>
          <button class="net-btn" data-net="BEP20" style="flex:1;padding:10px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:600;">BEP20</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">提币地址</label>
        <input class="form-input" type="text" id="wdAddr" placeholder="请输入或粘贴提币地址">
      </div>
      <div class="form-group">
        <label class="form-label">数量</label>
        <div class="input-wrap" style="margin-bottom:0;">
          <span class="input-label">数量</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <input type="number" step="any" inputmode="decimal" class="num" id="wdAmount" placeholder="0.00" style="width:140px;">
            <span class="input-unit" id="wdCoinUnit">USDT</span>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:8px;">
          <span>手续费：<span id="wdFeeText">1.00</span> <span id="wdFeeCoin">USDT</span></span>
          <a id="wdAll" style="color:var(--gold);font-weight:600;cursor:pointer;">全部提现</a>
        </div>
      </div>
    </div>
    <div class="card" style="font-size:12px;color:var(--text-2);line-height:1.8;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>到账数量</span><span class="num" id="wdReceive" style="color:var(--text);font-weight:600;">-- USDT</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>预计到账时间</span><span style="color:var(--text);">约 5-10 分钟</span></div>
    </div>
    <button class="btn btn-gold" id="wdBtn">确认提现</button>
    <div class="section-head" style="margin-top:24px;"><span class="section-title">提现记录</span></div>
    <div class="card" style="padding:0 16px;" id="wdRecords">
      <div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);" id="wdRecordsEmpty">加载中...</div>
    </div>
  </div>
  <div style="height:20px;"></div>
  <div id="bottomNavSlot" data-active="assets"></div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var FEES = {USDT: 1.0, BTC: 0.0001, ETH: 0.001, SOL: 0.01};
  var curCoin = 'USDT';
  var curNet = 'TRC20';
  var FEE = FEES[curCoin];
  // 币种选择器
  document.getElementById('wdCoinSelect').addEventListener('click', function(){
    var body = '<div style="display:flex;flex-direction:column;gap:6px;">' +
      ['USDT','BTC','ETH','SOL'].map(function(co){
        var checked = co===curCoin ? '✓ ' : '';
        return '<button class="btn btn-sm '+(co===curCoin?'btn-gold':'btn-outline')+'" data-coin="'+co+'" style="width:100%;text-align:left;padding:10px 14px;">'+checked+co+'</button>';
      }).join('') + '</div>';
    BTCBOX.modal({iconType:'info', title:'选择提币币种', bodyHtml:body, confirmText:'取消', cancelText:false});
    setTimeout(function(){
      document.querySelectorAll('.modal-body button[data-coin]').forEach(function(b){
        b.addEventListener('click', function(){
          curCoin = this.getAttribute('data-coin');
          FEE = FEES[curCoin];
          document.getElementById('wdCoinName').textContent = curCoin;
          document.getElementById('wdCoinUnit').textContent = curCoin;
          document.getElementById('wdFeeText').textContent = FEE.toFixed(curCoin==='USDT'?2:4);
          document.getElementById('wdFeeCoin').textContent = curCoin;
          // 重新加载对应币种余额
          fetch('/api/account', {credentials:'include'}).then(function(r){return r.json();}).then(function(j){
            if(j.ok && j.balances && j.balances[curCoin]){
              var b = j.balances[curCoin];
              avail = parseFloat(b.free !== undefined ? b.free : b.amount) || 0;
              document.getElementById('wdAvail').textContent = BTCBOX.fmtNum(avail, curCoin==='USDT'?2:6);
            }
          }).catch(function(){});
          recalc();
          // 根据币种更新可用网络
          var netMap = {
            'USDT': ['TRC20','ERC20','BEP20'],
            'BTC': ['Bitcoin'],
            'ETH': ['ERC20'],
            'SOL': ['Solana'],
            'BNB': ['BEP20']
          };
          var nets = netMap[curCoin] || ['TRC20'];
          var netWrap = document.getElementById('netBtnsWrap');
          if(netWrap){
            netWrap.innerHTML = nets.map(function(n, i){
              return '<button type="button" class="net-btn'+(i===0?' active':'')+'" data-net="'+n+'" style="'+(i===0?'background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);font-weight:700;':'background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);font-weight:600;')+'padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;margin-right:8px;margin-bottom:6px;">'+n+'</button>';
            }).join('');
            curNet = nets[0];
            bindNetBtns();
          }
          BTCBOX.toast('已切换到 '+curCoin, 'info');
          var overlay = document.querySelector('.modal-overlay');
          if(overlay){ overlay.classList.remove('show'); setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 300); }
        });
      });
    }, 50);
  });
  // 网络选择按钮事件绑定
  function bindNetBtns(){
    document.querySelectorAll('.net-btn').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.net-btn').forEach(function(x){
          x.classList.remove('active');
          x.style.background = 'var(--bg-2)';
          x.style.border = '1px solid var(--border)';
          x.style.color = 'var(--text-2)';
          x.style.fontWeight = '600';
        });
        this.classList.add('active');
        this.style.background = 'var(--gold-soft)';
        this.style.border = '1px solid var(--gold)';
        this.style.color = 'var(--gold)';
        this.style.fontWeight = '700';
        curNet = this.getAttribute('data-net');
        BTCBOX.toast('已切换到 '+curNet+' 网络', 'info');
      });
    });
  }
  bindNetBtns();
  var avail = 0;
  var fundPwdSet = false, twofaEnabled = false;
  if(BTCBOX.isLoggedIn()){
    fetch('/api/account', {credentials:'include'})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok){
          fundPwdSet = !!j.fund_password_set;
          twofaEnabled = !!j.twofa_enabled;
          if(j.balances && j.balances.USDT){
            var b = j.balances.USDT;
            avail = parseFloat(b.free !== undefined ? b.free : b.amount) || 0;
            document.getElementById('wdAvail').textContent = BTCBOX.fmtNum(avail);
          }
        }
      }).catch(function(){});
  }
  function recalc(){
    var a = parseFloat(document.getElementById('wdAmount').value) || 0;
    document.getElementById('wdReceive').textContent = BTCBOX.fmtNum(Math.max(0, a - FEE), curCoin==='USDT'?2:6) + ' ' + curCoin;
  }
  document.getElementById('wdAmount').addEventListener('input', recalc);
  document.getElementById('wdAll').addEventListener('click', function(){
    document.getElementById('wdAmount').value = avail; recalc();
  });
  function maskAddr(addr){
    if(!addr || addr.length < 12) return addr;
    return addr.slice(0,8) + '...' + addr.slice(-6);
  }
  function submitWithdraw(addr, amt, fundPwd, twofaCode){
    var btn = document.getElementById('wdBtn');
    btn.disabled = true; btn.textContent = '提交中...';
    fetch('/api/withdraw', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({coin:curCoin, network:curNet, address:addr, amount:amt, fund_password:fundPwd, twofa_code:twofaCode})
    })
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.ok){
        BTCBOX.toast('提现申请已提交，等待审核', 'success');
        setTimeout(function(){ location.reload(); }, 1500);
      } else {
        BTCBOX.toast(j.msg || '提交失败', 'error');
        btn.disabled = false; btn.textContent = '确认提现';
      }
    })
    .catch(function(){
      BTCBOX.toast('网络异常，请稍后重试', 'error');
      btn.disabled = false; btn.textContent = '确认提现';
    });
  }
  document.getElementById('wdBtn').addEventListener('click', function(){
    if(!BTCBOX.isLoggedIn()){ BTCBOX.requireLogin(); return; }
    var addr = document.getElementById('wdAddr').value.trim();
    var amt = parseFloat(document.getElementById('wdAmount').value) || 0;
    if(!addr){ BTCBOX.toast('请输入提币地址', 'warning'); return; }
    if(amt <= 0){ BTCBOX.toast('请输入提现数量', 'warning'); return; }
    if(amt > avail){ BTCBOX.toast('余额不足，无法提现', 'error'); return; }
    var receive = Math.max(0, amt - FEE);
    // 专业确认弹窗
    var bodyHtml = '请核对以下提币信息，确认无误后提交。<div class="modal-detail">' +
      '<div class="row"><span class="label">提币币种</span><span class="value">'+curCoin+' ('+curNet+')</span></div>' +
      '<div class="row"><span class="label">提币地址</span><span class="value" style="max-width:60%;text-align:right;word-break:break-all;">' + maskAddr(addr) + '</span></div>' +
      '<div class="row"><span class="label">提币数量</span><span class="value num">' + amt.toFixed(2) + ' USDT</span></div>' +
      '<div class="row"><span class="label">网络手续费</span><span class="value num">' + FEE.toFixed(2) + ' USDT</span></div>' +
      '<div class="row"><span class="label">实际到账</span><span class="value highlight num">' + receive.toFixed(2) + ' USDT</span></div>' +
      '</div>' +
      '<div class="modal-warn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>链上转账不可撤销，请务必确认地址与网络正确。若地址错误，资产将无法找回。</span></div>' +
      '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;"><input class="form-input" id="__fundPwd" type="password" inputmode="numeric" maxlength="6" placeholder="'+(fundPwdSet?'资金密码（6位数字）':'未设置资金密码，可留空直接提交')+'"><input class="form-input" id="__twofa" type="text" inputmode="numeric" maxlength="6" placeholder="'+(twofaEnabled?'2FA验证码（已启用双重验证，必填）':'未启用2FA，可留空')+'"></div>';
    BTCBOX.confirm({
      iconType: 'danger',
      title: '确认提币',
      bodyHtml: bodyHtml,
      confirmText: '确认提交',
      cancelText: '再检查一下',
      danger: true
    }).then(function(ok){
      if(!ok) return;
      var fp = (document.getElementById('__fundPwd')||{}).value || '';
      var tf = (document.getElementById('__twofa')||{}).value || '';
      if(fundPwdSet && !/^\d{6}$/.test(fp)){ BTCBOX.toast('请输入6位数字资金密码','warning'); return; }
      if(twofaEnabled && !/^\d{6}$/.test(tf)){ BTCBOX.toast('请输入6位2FA验证码','warning'); return; }
      submitWithdraw(addr, amt, fp, tf);
    });
  });
  // 提现记录加载
  function loadWdRecords(){
    if(!BTCBOX.isLoggedIn()){
      document.getElementById('wdRecords').innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">登录后查看提现记录</div>';
      return;
    }
    fetch('/api/account', {credentials:'include'}).then(function(r){return r.json();}).then(function(j){
      var box = document.getElementById('wdRecords');
      var list = (j.ok && j.withdrawals) ? j.withdrawals : [];
      if(!list.length){ box.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">暂无提现记录</div>'; return; }
      var ST = {pending:['审核中','#f0b90b','rgba(240,185,11,.15)'], approved:['已通过','#0ecb81','rgba(14,203,129,.15)'], rejected:['已拒绝','#f6465d','rgba(246,70,93,.15)']};
      box.innerHTML = list.slice(0,10).map(function(w){
        var s = ST[w.status] || ['处理中','#f0b90b','rgba(240,185,11,.15)'];
        var rej = w.status==='rejected' && w.reject_reason ? '<div style="font-size:11px;color:#f6465d;margin-top:3px;">拒绝原因：'+w.reject_reason+'</div>' : '';
        return '<div style="padding:12px 0;border-bottom:1px solid var(--border);">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:700;font-size:13px;">'+(w.coin||'USDT')+' · '+(w.network||'TRC20')+'</span>'+
          '<span style="padding:2px 8px;border-radius:6px;background:'+s[2]+';color:'+s[1]+';font-size:11px;font-weight:700;">'+s[0]+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:5px;"><span class="num">'+(w.amount||0)+' '+(w.coin||'USDT')+'</span><span>手续费 '+(w.fee||0)+'</span><span>'+(w.time||'')+'</span></div>'+
          '<div style="font-size:11px;color:var(--text-3);margin-top:3px;word-break:break-all;">地址：'+(w.address? (w.address.slice(0,10)+'...'+w.address.slice(-6)) : '--')+'</div>'+rej+'</div>';
      }).join('');
    }).catch(function(){
      document.getElementById('wdRecords').innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">加载失败，请刷新重试</div>';
    });
  }
  loadWdRecords();
})();
</script>
</body>
</html>
