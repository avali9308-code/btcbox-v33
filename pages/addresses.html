<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><link href="../assets/img/logo-transparent.png" rel="icon" type="image/png"/><meta content="#0a0e1a" name="theme-color"/><title data-i18n="r131_0">地址绑定 · BTCBOX</title><link href="../assets/css/style.css" rel="stylesheet"/><style>.addr-form{display:grid;gap:12px}.addr-form label{display:grid;gap:6px;font-size:12px;color:var(--text-2)}.addr-form input,.addr-form select{width:100%;min-width:0}.addr-card{padding:14px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:380px){.addr-grid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><header class="header"><a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='me.html';return false;}"><svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="m15 18-6-6 6-6"></path></svg></a><span class="page-title"><span data-i18n="r131_1">地址绑定</span></span><span style="width:36px"></span></header><main class="content"><div class="card"><div class="section-title" style="margin-bottom:14px"><span data-i18n="r131_2">新增地址</span></div><div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn btn-outline" id="cryptoTab" type="button"><span data-i18n="r131_3">加密货币地址</span></button><button class="btn btn-outline" id="bankTab" type="button"><span data-i18n="r131_4">银行账户</span></button></div>
<form class="addr-form" id="cryptoForm"><label><span data-i18n="r131_5">币种</span><select id="coin"><option>BTC</option><option>USDT</option><option>ETH</option><option>SOL</option></select></label><label><span data-i18n="r131_6">网络</span><select id="network"></select></label><label><span data-i18n="r131_7">地址</span><input autocomplete="off" data-i18n-placeholder="r131_14" id="address" placeholder="输入加密货币地址" required=""/></label><label><span data-i18n="r131_8">备注</span><input data-i18n-placeholder="r131_15" id="cryptoNote" maxlength="80" placeholder="备注（选填）"/></label><button class="btn btn-gold" type="submit"><span data-i18n="r131_9">保存</span></button></form>
<form class="addr-form" id="bankForm" style="display:none"><label><span data-i18n="accountHolder">账户持有人姓名</span><input autocomplete="name" name="account_holder" required=""/></label><label><span data-i18n="bankName">银行名称</span><input name="bank_name" required=""/></label><div class="addr-grid"><label><span data-i18n="accountNumber">账号</span><input inputmode="numeric" name="account_number" required=""/></label><label><span data-i18n="routingNumber">Routing Number / ABA</span><input inputmode="numeric" maxlength="9" name="routing_number" pattern="[0-9]{9}" required=""/></label></div><label><span data-i18n="swiftBic">SWIFT / BIC</span><input maxlength="11" name="swift" pattern="[A-Za-z0-9]{8}([A-Za-z0-9]{3})?"/></label><label><span data-i18n="bankAddress">银行地址</span><input name="bank_address" required=""/></label><label><span data-i18n="r131_8">备注</span><input maxlength="80" name="note"/></label><button class="btn btn-gold" type="submit"><span data-i18n="r131_9">保存</span></button></form></div>
<div class="section-head"><span class="section-title"><span data-i18n="r131_10">已绑定地址</span></span></div><div class="card" id="addressList"><span data-i18n="r131_11">加载中…</span></div><p style="font-size:12px;color:var(--text-3);line-height:1.6"><span data-i18n="r131_13">地址一经绑定，用户不可自行修改或删除。如需更改或解绑，请联系客服处理。</span></p><div id="pageMsg" role="status" style="font-size:12px"></div></main><div data-active="me" id="bottomNavSlot"></div></div><script src="../assets/js/i18n.js"></script><script src="../assets/js/app.js"></script><script>
(function(){var $=function(id){return document.getElementById(id)};var nets={BTC:['BTC'],USDT:['TRC20','ERC20','BEP20'],ETH:['ERC20'],SOL:['SOL']};function updateNets(){$('network').innerHTML=nets[$('coin').value].map(function(n){return '<option>'+n+'</option>'}).join('')}updateNets();$('coin').addEventListener('change',updateNets);function switchForm(bank){$('cryptoForm').style.display=bank?'none':'grid';$('bankForm').style.display=bank?'grid':'none'}$('cryptoTab').onclick=function(){switchForm(false)};$('bankTab').onclick=function(){switchForm(true)};function msg(t,ok){$('pageMsg').textContent=t;$('pageMsg').style.color=ok?'var(--up)':'var(--down)'}function send(data){return fetch('/api/addresses',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(j){msg(j.ok?I18N.translateMessage('提交成功'):I18N.translateMessage(j.msg||I18N.t('addressOperationFailed')),!!j.ok);if(j.ok){$('cryptoForm').reset();$('bankForm').reset();updateNets();load()}return j}).catch(function(){msg(I18N.t('addressNetworkError'),false)})}$('cryptoForm').addEventListener('submit',function(e){e.preventDefault();send({type:'crypto',coin:$('coin').value,network:$('network').value,address:$('address').value.trim(),note:$('cryptoNote').value.trim()})});$('bankForm').addEventListener('submit',function(e){e.preventDefault();var o={type:'bank'};new FormData(this).forEach(function(v,k){o[k]=v});send(o)});function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function load(){fetch('/api/addresses',{credentials:'include',cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(!j.ok){$('addressList').textContent=I18N.translateMessage(j.msg||I18N.t('addressOperationFailed'));return}var a=j.addresses||[];$('addressList').innerHTML=a.length?a.map(function(x){return '<div class="addr-card"><strong>'+esc(x.type==='bank'?(x.bank_name||'Bank account'):(x.coin+' · '+x.network))+'</strong><div style="margin-top:7px;font-size:12px;color:var(--text-2)">'+esc(x.type==='bank'?((x.account_holder||'')+' · '+(x.account_number||'')):(x.address||''))+'</div><div style="font-size:11px;color:var(--text-3);margin-top:5px">'+esc(x.note||'')+' · '+esc(x.created_at||'')+'</div><div style="font-size:11px;margin-top:8px">'+esc(I18N.t('contactSupportForChanges'))+'</div></div>'}).join(''):I18N.t('noSavedAddresses')}).catch(function(){$('addressList').textContent=I18N.t('addressNetworkError')})}if(window.BTCBOX&&!BTCBOX.isLoggedIn()){location.href='login.html'}load()})();</script></body></html>
