<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>充值 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .coin-select{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;}
  .coin-select::-webkit-scrollbar{display:none;}
  .coin-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--bg-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;}
  .coin-chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .net-select{display:flex;gap:8px;margin-top:4px;}
  .net-btn{flex:1;padding:9px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2);cursor:pointer;}
  .net-btn.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .addr-box{word-break:break-all;font-size:12px;font-weight:600;background:var(--bg-2);padding:12px;border-radius:10px;border:1px solid var(--border);line-height:1.6;user-select:all;}
  .qr-wrap{width:180px;height:180px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;}
  .qr-wrap img{width:100%;height:100%;}
  .deposit-record{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .deposit-record:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="page-title">充值</span>
    </div>
  </header>
  <div class="content">
    <div class="security-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      请确认充值地址与网络一致，错充将无法找回
    </div>

    <div class="card" style="margin-bottom:14px;">
      <label class="form-label" style="display:block;margin-bottom:8px;">选择币种</label>
      <div class="coin-select" id="coinSelect">
        <button class="coin-chip active" data-coin="USDT">USDT</button>
        <button class="coin-chip" data-coin="BTC">BTC</button>
        <button class="coin-chip" data-coin="ETH">ETH</button>
        <button class="coin-chip" data-coin="SOL">SOL</button>
      </div>
      <label class="form-label" style="display:block;margin:12px 0 8px;">选择网络</label>
      <div class="net-select" id="netSelect">
        <button class="net-btn active" data-net="TRC20">TRC20</button>
        <button class="net-btn" data-net="ERC20">ERC20</button>
        <button class="net-btn" data-net="BEP20">BEP20</button>
      </div>
    </div>

    <div class="card" style="text-align:center;padding:24px 16px;" id="addrCard">
      <div style="font-size:12px;color:var(--text-2);margin-bottom:14px;" id="addrTitle">USDT (TRC20) 充值地址</div>
      <div class="qr-wrap" id="qrWrap">
        <img id="qrImg" src="" alt="充值二维码">
      </div>
      <div class="addr-box num" id="addrText">加载中...</div>
      <button class="btn btn-sm btn-gold" id="copyAddr" style="width:auto;padding:0 24px;margin-top:14px;">复制地址</button>
    </div>

    <div class="card" style="font-size:12px;color:var(--text-2);line-height:1.8;">
      <div style="font-weight:700;color:var(--text);margin-bottom:6px;">温馨提示</div>
      · 最小充值金额：1 USDT（或等值），少于最小金额将无法到账<br>
      · 充值确认数：20 个区块确认后到账<br>
      · 请勿充值非对应币种资产至该地址
    </div>

    <div class="section-head" style="margin-top:20px;"><span class="section-title">最近充值记录</span></div>
    <div class="card" style="padding:0 16px;" id="recordList">
      <div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);" id="recordEmpty">加载中...</div>
    </div>
  </div>
  <div style="height:20px;"></div>
  <div id="bottomNavSlot" data-active="assets"></div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var curCoin = 'USDT', curNet = 'TRC20';
  var NETS = {USDT:['TRC20','ERC20','BEP20'], BTC:['Bitcoin'], ETH:['ERC20'], SOL:['Solana']};

  function loadAddr(){
    document.getElementById('addrTitle').textContent = curCoin + ' (' + curNet + ') 充值地址';
    document.getElementById('addrText').textContent = '加载中...';
    document.getElementById('qrImg').src = '';
    if(!BTCBOX.isLoggedIn()){
      document.getElementById('addrText').textContent = '请先登录后获取充值地址';
      BTCBOX.toast('请先登录后获取充值地址', 'warning');
      setTimeout(function(){ location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); }, 1000);
      return;
    }
    fetch('/api/deposit', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({coin:curCoin, network:curNet, amount:0})
    })
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.ok && j.address){
        if(j.address.indexOf('PLACEHOLDER') > -1){
          document.getElementById('addrText').textContent = '充值通道维护中，请联系在线客服获取地址';
          document.getElementById('qrImg').style.display = 'none';
        } else {
          document.getElementById('addrText').textContent = j.address;
          document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=' + encodeURIComponent(j.address);
        }
      } else {
        document.getElementById('addrText').textContent = (j.msg || '获取地址失败，请稍后重试');
      }
    })
    .catch(function(){
      document.getElementById('addrText').textContent = '网络异常，请稍后重试';
    });
  }

  function bindNetBtns(){
    document.querySelectorAll('#netSelect .net-btn').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('#netSelect .net-btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active'); curNet = b.dataset.net; loadAddr();
      });
    });
  }
  bindNetBtns();

  document.querySelectorAll('#coinSelect .coin-chip').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#coinSelect .coin-chip').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); curCoin = b.dataset.coin;
      var nets = NETS[curCoin] || ['TRC20'];
      var ns = document.getElementById('netSelect');
      ns.innerHTML = nets.map(function(n,i){return '<button class="net-btn'+(i===0?' active':'')+'" data-net="'+n+'">'+n+'</button>';}).join('');
      curNet = nets[0];
      bindNetBtns();
      loadAddr();
    });
  });

  document.getElementById('copyAddr').addEventListener('click', function(){
    var t = document.getElementById('addrText').textContent;
    if(t && t.indexOf('...')<0 && t.indexOf('加载')<0 && t.indexOf('请')<0 && t.indexOf('网络')<0){
      navigator.clipboard && navigator.clipboard.writeText(t);
      BTCBOX.toast('充值地址已复制到剪贴板', 'success');
    } else { BTCBOX.toast('地址尚未就绪，请稍候', 'warning'); }
  });

  function loadRecords(){
    var listEl = document.getElementById('recordList');
    if(!BTCBOX.isLoggedIn()){
      listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">登录后查看充值记录</div>';
      return;
    }
    fetch('../api/account', {credentials:'include'})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok && j.deposits && j.deposits.length){
          listEl.innerHTML = j.deposits.slice(0,5).map(function(d){
            var st = d.status==='confirmed' || d.status==='completed' ? '<span style="color:var(--up);">已到账</span>' : '<span style="color:var(--gold);">确认中</span>';
            return '<div class="deposit-record"><div style="display:flex;justify-content:space-between;"><span style="font-weight:700;">'+d.coin+' · '+d.network+'</span>'+st+'</div>'+
              '<div style="color:var(--text-3);margin-top:3px;display:flex;justify-content:space-between;"><span class="num">'+d.amount+' '+d.coin+'</span><span>'+d.time+'</span></div></div>';
          }).join('');
        } else {
          listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">暂无充值记录</div>';
        }
      })
      .catch(function(){
        listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">暂无充值记录</div>';
      });
  }
  loadAddr();
  loadRecords();
})();
</script>
</body>
</html>
