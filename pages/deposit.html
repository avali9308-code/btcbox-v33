<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<link href="../assets/img/logo-transparent.png" rel="icon" type="image/png"/>
<meta content="#0a0e1a" name="theme-color"/>
<title data-i18n="r131_112">充值 · BTCBOX</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
  .coin-select{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;}
  .coin-select::-webkit-scrollbar{display:none;}
  .coin-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--bg-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;}
  .coin-chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .net-select{display:flex;gap:8px;margin-top:4px;}
  .net-btn{flex:1;padding:9px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2);cursor:pointer;}
  .net-btn.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .addr-box{word-break:break-all;font-size:12px;font-weight:600;background:var(--bg-2);padding:12px;border-radius:10px;border:1px solid var(--border);line-height:1.6;user-select:all;}
  .qr-wrap{width:180px;height:180px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;}
  .qr-wrap img{width:100%;height:100%;}
  .deposit-record{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .deposit-record:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div style="display:flex;align-items:center;gap:10px;">
<a class="header-back" href="javascript:history.back()" onclick="if(history.length&lt;=1){location.href='../index.html';return false;}"><svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="m15 18-6-6 6-6"></path></svg></a>
<span class="page-title"><span data-i18n="r131_113">充值</span></span>
</div>
</header>
<div class="content">
<div class="security-bar">
<svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
<span data-i18n="r131_114">请确认充值地址与网络一致，错充将无法找回</span>
</div>
<div class="card" style="margin-bottom:14px;">
<label class="form-label" style="display:block;margin-bottom:8px;"><span data-i18n="r131_115">选择币种</span></label>
<div class="coin-select" id="coinSelect">
<button class="coin-chip active" data-coin="USDT">USDT</button>
<button class="coin-chip" data-coin="BTC">BTC</button>
<button class="coin-chip" data-coin="ETH">ETH</button>
<button class="coin-chip" data-coin="SOL">SOL</button>
</div>
<label class="form-label" style="display:block;margin:12px 0 8px;"><span data-i18n="r131_116">选择网络</span></label>
<div class="net-select" id="netSelect">
<button class="net-btn active" data-net="TRC20">TRC20</button>
<button class="net-btn" data-net="ERC20">ERC20</button>
<button class="net-btn" data-net="BEP20">BEP20</button>
</div>
</div>
<div class="card" id="addrCard" style="text-align:center;padding:24px 16px;">
<div id="addrTitle" style="font-size:12px;color:var(--text-2);margin-bottom:14px;"><span data-i18n="r131_117">USDT (TRC20) 充值地址</span></div>
<div class="qr-wrap" id="qrWrap">
<canvas aria-label="Deposit address QR code" id="qrImg" role="img" width="180" height="180" style="display:none;max-width:100%;height:auto;margin:0 auto;"></canvas><div id="qrFallback" class="muted" role="status" style="font-size:12px;display:none;">QR preview unavailable. Copy the address below and verify the network before sending.</div>
</div>
<div class="addr-box num" id="addrText"><span data-i18n="r131_12">加载中...</span></div>
<button class="btn btn-sm btn-gold" id="copyAddr" style="width:auto;padding:0 24px;margin-top:14px;"><span data-i18n="r131_118">复制地址</span></button>
</div>
<div class="card" style="font-size:12px;color:var(--text-2);line-height:1.8;">
<div style="font-weight:700;color:var(--text);margin-bottom:6px;"><span data-i18n="r131_119">温馨提示</span></div>
<span data-i18n="r131_120">· 最小充值金额：1 USDT（或等值），少于最小金额将无法到账</span><br/>
<span data-i18n="r131_121">· 充值确认数：20 个区块确认后到账</span><br/>
<span data-i18n="r131_122">· 请勿充值非对应币种资产至该地址</span>
</div>
<div class="section-head" style="margin-top:20px;"><span class="section-title"><span data-i18n="r131_123">最近充值记录</span></span></div>
<div class="card" id="recordList" style="padding:0 16px;">
<div id="recordEmpty" style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);"><span data-i18n="r131_12">加载中...</span></div>
</div>
</div>
<div style="height:20px;"></div>
<div data-active="assets" id="bottomNavSlot"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var curCoin = 'USDT', curNet = 'TRC20';
  var NETS = {USDT:['TRC20','ERC20','BEP20'], BTC:['Bitcoin'], ETH:['ERC20'], SOL:['Solana']};

  var addrRequestVersion = 0;
  function loadAddr(){
    var requestVersion = ++addrRequestVersion, requestCoin = curCoin, requestNet = curNet;
    document.getElementById('addrTitle').textContent = curCoin + ' (' + curNet + ') '+I18N.t('depositAddressTitle');
    document.getElementById('addrText').textContent = I18N.t('loadingText');
    document.getElementById('qrImg').style.display = 'none';
    document.getElementById('qrFallback').style.display = 'none';
    if(!BTCBOX.isLoggedIn()){
      document.getElementById('addrText').textContent = I18N.t('loginToGetDepositAddress');
      BTCBOX.toast((window.I18N?I18N.t('pleaseLoginDeposit'):''), 'warning');
      setTimeout(function(){ location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); }, 1000);
      return;
    }
    fetch('/api/deposit', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({coin:curCoin, network:curNet, amount:0})
    })
    .then(function(r){return r.json();})
    .then(function(j){
      if(requestVersion !== addrRequestVersion || requestCoin !== curCoin || requestNet !== curNet) return;
      if(j.ok && j.address){
        if(j.address.indexOf('PLACEHOLDER') > -1){
          document.getElementById('addrText').textContent = I18N.t('depositChannelMaintenance');
          document.getElementById('qrImg').style.display = 'none';
          document.getElementById('qrFallback').style.display = 'none';
        } else {
          document.getElementById('addrText').textContent = j.address;
          var qrCanvas = document.getElementById('qrImg');
          qrCanvas.style.display = 'none';
          document.getElementById('qrFallback').style.display = 'block';
          if (window.QRCode && typeof window.QRCode.toCanvas === 'function') {
            window.QRCode.toCanvas(qrCanvas, j.address, {width:180, margin:1}, function(err) {
              if (!err) { qrCanvas.style.display = 'block'; document.getElementById('qrFallback').style.display = 'none'; }
            });
          }
        }
      } else {
        document.getElementById('addrText').textContent = (I18N.t('addressFetchFailed'));
      }
    })
    .catch(function(){
      if(requestVersion !== addrRequestVersion || requestCoin !== curCoin || requestNet !== curNet) return;
      document.getElementById('addrText').textContent = I18N.t('networkTryAgain');
    });
  }

  function bindNetBtns(){
    document.querySelectorAll('#netSelect .net-btn').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('#netSelect .net-btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active'); curNet = b.dataset.net; loadAddr();
      });
    });
  }
  bindNetBtns();

  document.querySelectorAll('#coinSelect .coin-chip').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#coinSelect .coin-chip').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); curCoin = b.dataset.coin;
      var nets = NETS[curCoin] || ['TRC20'];
      var ns = document.getElementById('netSelect');
      ns.innerHTML = nets.map(function(n,i){return '<button class="net-btn'+(i===0?' active':'')+'" data-net="'+n+'">'+n+'</button>';}).join('');
      curNet = nets[0];
      bindNetBtns();
      loadAddr();
    });
  });

  document.getElementById('copyAddr').addEventListener('click', function(){
    var t = document.getElementById('addrText').textContent;
    var notReady = [I18N.t('loadingText'), I18N.t('loginToGetDepositAddress'), I18N.t('depositChannelMaintenance'), I18N.t('addressFetchFailed'), I18N.t('networkTryAgain')];
    if(t && notReady.indexOf(t)<0 && t.indexOf('...')<0){
      navigator.clipboard && navigator.clipboard.writeText(t);
      BTCBOX.toast((window.I18N?I18N.t('addrCopied'):''), 'success');
    } else { BTCBOX.toast((window.I18N?I18N.t('addrNotReady'):''), 'warning'); }
  });

  function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}

  function loadRecords(){
    var listEl = document.getElementById('recordList');
    if(!BTCBOX.isLoggedIn()){
      listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">'+I18N.t('loginViewDepositHistory')+'</div>';
      return;
    }
    fetch('../api/account', {credentials:'include', cache:'no-store'})
      .then(function(r){if(!r.ok) throw new Error('account_unavailable'); return r.json();})
      .then(function(j){
        if(!j || !j.ok) throw new Error('account_unavailable');
        if(j.deposits && j.deposits.length){
          listEl.innerHTML = j.deposits.slice(0,5).map(function(d){
            var status = String(d.status||'').toLowerCase();
            var statusCopy = status==='confirmed' || status==='completed' ? I18N.t('depositConfirmed') :
              (status==='rejected' || status==='failed' ? I18N.t('depositFailed') :
              (status==='pending' || status==='confirming' || status==='processing' ? I18N.t('depositConfirming') : I18N.t('depositStatusUnknown')));
            var statusColor = status==='confirmed' || status==='completed' ? 'var(--up)' :
              (status==='rejected' || status==='failed' ? 'var(--down)' : 'var(--gold)');
            return '<div class="deposit-record"><div style="display:flex;justify-content:space-between;"><span style="font-weight:700;">'+escapeHtml(d.coin||'--')+' · '+escapeHtml(d.network||'--')+'</span><span style="color:'+statusColor+';">'+statusCopy+'</span></div>'+
              '<div style="color:var(--text-3);margin-top:3px;display:flex;justify-content:space-between;"><span class="num">'+escapeHtml(d.amount==null?'--':d.amount)+' '+escapeHtml(d.coin||'')+'</span><span>'+escapeHtml(d.time||'--')+'</span></div></div>';
          }).join('');
        } else {
          listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">'+I18N.t('noDepositHistory')+'</div>';
        }
      })
      .catch(function(){
        listEl.innerHTML = '<div style="padding:20px 0;text-align:center;font-size:12px;color:var(--text-3);">'+I18N.t('recordsLoadFailed')+'</div>';
      });
  }
  loadAddr();
  loadRecords();
  document.addEventListener('langChange', function(){ loadRecords(); loadAddr(); });
})();
</script>
</body>
</html>
