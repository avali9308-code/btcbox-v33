<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>资产 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="page-title">我的资产</span>
    </div>
    <a class="icon-btn" href="orders.html?tab=history" aria-label="交易记录">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </a>
  </header>

  <div class="content">
    <!-- 登录态 -->
    <div data-auth="logged-in">
      <div class="card-glow" style="margin-top:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:12px;color:var(--text-2);">总资产估值 (USDT)</span>
          <button id="eyeBtn2" style="background:none;border:none;color:var(--text-2);cursor:pointer;padding:4px;display:flex;">
            <svg id="eyeOpen2" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff2" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          </button>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span id="assetTotal" class="num" style="font-size:32px;font-weight:800;letter-spacing:-.02em;">0.00</span>
          <span style="font-size:13px;color:var(--text-3);font-weight:600;">USDT</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <span class="num" id="todayPnl" style="font-size:13px;font-weight:600;color:var(--text-3);">--</span>
          <span style="font-size:11px;color:var(--text-3);">今日盈亏</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <a class="btn btn-sm btn-gold" href="deposit.html" style="flex:1;">充值</a>
          <a class="btn btn-sm btn-outline" href="withdraw.html" style="flex:1;">提现</a>
          <a class="btn btn-sm btn-outline" href="orders.html" style="flex:1;">订单</a>
        </div>
      </div>

      <div class="section-head"><span class="section-title">币种资产</span><span id="hideSmallBtn" style="font-size:11px;color:var(--text-3);cursor:pointer;">隐藏小额资产</span></div>
      <div id="assetList"></div>
    </div>

    <!-- 游客态 -->
    <div data-auth="guest" style="padding-top:40px;">
      <div class="guest-card">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);margin:0 auto 14px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
        </div>
        <div class="guest-title">登录后查看资产</div>
        <p class="guest-sub">安全管理您的数字资产，查看余额与盈亏</p>
        <div class="guest-actions">
          <a class="btn btn-sm btn-gold" href="login.html?mode=register" style="width:auto;padding:0 28px;">立即注册</a>
          <a class="btn btn-sm btn-outline" href="login.html" style="width:auto;padding:0 28px;">登录</a>
        </div>
      </div>
    </div>
  </div>

  <div style="height:16px;"></div>
  <div id="bottomNavSlot" data-active="assets"></div>
</div>

<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var realBalances = {};
  var realTotal = 0;
  var COIN_NAMES = {USDT:'Tether', BTC:'Bitcoin', ETH:'Ethereum', SOL:'Solana', BNB:'BNB', XRP:'Ripple', DOGE:'Dogecoin', LINK:'Chainlink'};
  function loadAccount(){
    fetch('../api/account', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.ok){
          realBalances = j.balances || {};
          realTotal = j.total_usdt || 0;
          renderAssets();
        }
      }).catch(function(){});
  }
  function renderAssets(){
    var hidden = BTCBOX.account.hideAsset;
    var listEl = document.getElementById('assetList');
    var items = [];
    Object.keys(realBalances).forEach(function(sym){
      var b = realBalances[sym];
      var amt = b.amount || 0;
      if(amt <= 0) return;
      var value = b.usdt || 0;
      items.push({sym: sym, name: COIN_NAMES[sym] || sym, free: amt, value: value});
    });
    if(items.length === 0){
      listEl.innerHTML = '<div style="padding:28px 0;text-align:center;font-size:12px;color:var(--text-3);">暂无资产，<a href="deposit.html" style="color:var(--gold);">立即充值</a></div>';
    } else {
      if(hideSmall){ items = items.filter(function(b){ return b.value >= 1; }); }
    items.sort(function(a,b){ return b.value - a.value; });
      listEl.innerHTML = items.map(function(b){
        return '<div class="list-item" style="cursor:default;">'+
          '<div class="list-item-left">'+BTCBOX.coinIconHtml(b.sym,36)+
          '<div><div class="list-item-title">'+b.sym+'</div><div class="list-item-sub num">可用 '+BTCBOX.fmtNum(b.free, b.sym==='USDT'?2:6)+'</div></div></div>'+
          '<div style="text-align:right;"><div class="num" style="font-size:14px;font-weight:700;">'+(hidden?'******':BTCBOX.fmtNum(b.value))+'</div>'+
          '<div style="font-size:11px;color:var(--text-3);margin-top:2px;">≈ '+BTCBOX.fmtNum(b.value)+' USDT</div></div></div>';
      }).join('');
    }
    document.getElementById('assetTotal').textContent = hidden ? '******' : BTCBOX.fmtNum(realTotal);
  }
  renderAssets();
  loadAccount();
  document.addEventListener('accountChange', loadAccount);
  var hideSmall = false;
  document.getElementById('hideSmallBtn').addEventListener('click', function(){
    hideSmall = !hideSmall;
    this.style.color = hideSmall ? 'var(--gold)' : 'var(--text-3)';
    this.textContent = hideSmall ? '显示全部资产' : '隐藏小额资产';
    renderAssets();
  });
  document.getElementById('eyeBtn2').addEventListener('click', function(){
    BTCBOX.account.hideAsset = !BTCBOX.account.hideAsset;
    BTCBOX.saveAccount();
    document.getElementById('eyeOpen2').style.display = BTCBOX.account.hideAsset?'none':'block';
    document.getElementById('eyeOff2').style.display = BTCBOX.account.hideAsset?'block':'none';
    renderAssets();
    BTCBOX.toast(BTCBOX.account.hideAsset ? '资产已隐藏' : '资产已显示', 'info');
  });
})();
</script>
</body>
</html>
