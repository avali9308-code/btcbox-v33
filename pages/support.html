<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<link href="../assets/img/logo-transparent.png" rel="icon" type="image/png"/>
<meta content="#0a0e1a" name="theme-color"/>
<title data-i18n="r131_77">在线客服 · BTCBOX</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 56px);height:calc(100dvh - 56px);max-width:520px;margin:0 auto;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;}
  .chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;position:relative;}
  .chat-online{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#0ecb81;border:2px solid var(--card);}
  .chat-title{font-size:14px;font-weight:700;}
  .chat-sub{font-size:11px;color:#0ecb81;margin-top:2px;display:flex;align-items:center;gap:5px;}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);}
  .chat-date{text-align:center;font-size:10px;color:var(--text-3);padding:4px 0;}
  .msg-row{display:flex;gap:8px;max-width:85%;animation:msgIn .3s ease;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-row.admin{align-self:flex-start;}
  .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
  .msg-row.admin .msg-avatar{background:var(--gold-soft);color:var(--gold);}
  .msg-row.user .msg-avatar{background:var(--bg-2);color:var(--text-2);}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word;}
  .msg-row.admin .msg-bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text);}
  .msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#0a0e1a;font-weight:600;border-top-right-radius:4px;}
  .msg-time{font-size:10px;color:var(--text-3);margin-top:4px;text-align:right;}
  .msg-row.admin .msg-time{text-align:left;}
  .quick-qs{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;flex-shrink:0;}
  .quick-q{padding:7px 14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--border);font-size:12px;color:var(--text-2);cursor:pointer;transition:all .2s;}
  .quick-q:hover{border-color:var(--gold);color:var(--gold);}
  .chat-input-wrap{position:sticky;bottom:0;z-index:5;padding-bottom:max(10px, env(safe-area-inset-bottom));display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .chat-input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text);font-size:16px;outline:none;}
  .chat-input:focus{border-color:var(--gold);}
  .chat-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#0a0e1a;}
  .chat-send:disabled{opacity:.4;cursor:not-allowed;}
  .typing{display:inline-flex;gap:3px;padding:10px 14px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:typing 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
  .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;gap:10px;padding:40px;text-align:center;}
</style>
</head>
<body style="overflow:hidden;height:100vh;">
<div class="app">
<header class="header">
<div style="display:flex;align-items:center;gap:10px;">
<a class="header-back" href="javascript:history.back()" onclick="if(history.length&lt;=1){location.href='../index.html';return false;}"><svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="m15 18-6-6 6-6"></path></svg></a>
<span class="page-title"><span data-i18n="r131_78">在线客服</span></span>
</div>
</header>
<div class="chat-wrap">
<div class="chat-head">
<div class="chat-avatar">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
<div class="chat-online"></div>
</div>
<div>
<div class="chat-title"><span data-i18n="r131_79">BTCBOX 专属客服</span></div>
<div class="chat-sub"><span class="pulse-dot" style="background:#0ecb81;"></span><span data-i18n="r131_80">在线 · 工作时间内尽快回复</span></div>
</div>
</div>
<div aria-live="polite" aria-relevant="additions text" class="chat-body" id="chatBody" role="log">
<div class="chat-empty" id="chatEmpty">
<svg fill="none" height="48" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" style="opacity:.4;" viewbox="0 0 24 24" width="48"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
<div><span data-i18n="r131_81">暂无对话，发送消息开始咨询</span></div>
</div>
</div>
<div class="quick-qs" id="quickQs">
<div class="quick-q" data-q="如何充值数字资产？" data-q-en="How do I deposit digital assets?"><span data-i18n="r131_82">如何充值？</span></div>
<div class="quick-q" data-q="提币多久能到账？" data-q-en="How long do withdrawals take?"><span data-i18n="r131_83">提币到账时间</span></div>
<div class="quick-q" data-q="如何完成身份认证(KYC)？" data-q-en="How do I complete identity verification (KYC)?"><span data-i18n="r131_84">KYC 认证</span></div>
<div class="quick-q" data-q="忘记密码怎么办？" data-q-en="What if I forget my password?"><span data-i18n="r131_85">忘记密码</span></div>
<div class="quick-q" data-q="交易费率是多少？" data-q-en="What are the trading fees?"><span data-i18n="r131_86">交易费率</span></div>
</div>
<div class="chat-input-wrap">
<input aria-label="请输入您的问题" autocomplete="off" class="chat-input" data-i18n-aria-label="r131_92" data-i18n-placeholder="r131_93" id="chatInput" maxlength="500" placeholder="请输入您的问题..."/>
<button aria-label="发送" class="chat-send" data-i18n-aria-label="r131_94" id="chatSend">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="18"><line x1="22" x2="11" y1="2" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
</button>
</div>
</div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var body = document.getElementById('chatBody');
  var empty = document.getElementById('chatEmpty');
  var input = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');
  var lastMsgId = 0;
  var seenIds = Object.create(null);
  var polling = null;
  var inPages = location.pathname.indexOf('/pages/') > -1;
  var base = inPages ? '../' : '';

  function fmtTime(t){
    if(!t) return '';
    var parts = t.split(' ');
    return parts.length > 1 ? parts[1].slice(0,5) : t;
  }
  function appendMsg(m){
    if(empty){ empty.remove(); empty = null; }
    var row = document.createElement('div');
    var fromAdmin = !!(m.from_admin || m.from === 'admin');
    row.className = 'msg-row ' + (fromAdmin ? 'admin' : 'user');
    var avatar = fromAdmin ? I18N.t('supportAgentAvatar') : I18N.t('supportUserAvatar');
    row.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' +
      '<div><div class="msg-bubble"></div><div class="msg-time">' + fmtTime(m.time) + '</div></div>';
    row.querySelector('.msg-bubble').textContent = m.content;
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }
  function showTyping(){
    var row = document.createElement('div');
    row.className = 'msg-row admin';
    row.id = 'typingRow';
    row.innerHTML = '<div class="msg-avatar">' + I18N.t('supportAgentAvatar') + '</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }
  function hideTyping(){
    var t = document.getElementById('typingRow');
    if(t) t.remove();
  }
  function renderHistory(messages){
    body.innerHTML = '';
    empty = null;
    if(!messages || !messages.length){
      body.innerHTML = '<div class="chat-empty" id="chatEmpty"><div>' + I18N.t('noChatYet') + '</div></div>';
      empty = document.getElementById('chatEmpty');
      lastMsgId = 0;
      seenIds = Object.create(null);
      return;
    }
    seenIds = Object.create(null);
    messages.forEach(function(m){ appendMsg(m); seenIds[String(m.id)] = true; });
    lastMsgId = messages[messages.length - 1].id || 0;
  }
  function fetchHistory(){
    return fetch(base + 'api/support/messages', {credentials:'include', cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('history request failed'); return r.json(); })
      .then(function(j){ if(j.ok && Array.isArray(j.messages)) return j.messages; throw new Error(I18N.t('operationFailedRetry')); });
  }
  function loadHistory(){ return fetchHistory().then(renderHistory); }
  function poll(){
    fetchHistory().then(function(messages){
      var added = false;
      messages.forEach(function(m){
        var key = String(m.id);
        if(!seenIds[key]){ seenIds[key] = true; appendMsg(m); added = true; }
      });
      if(messages.length) lastMsgId = messages[messages.length - 1].id || lastMsgId;
      if(added) hideTyping();
    }).catch(function(){});
  }
  function sendMsg(text){
    if(!BTCBOX.isLoggedIn()){
      BTCBOX.toast((window.I18N?I18N.t('pleaseLoginSupport'):''), 'warning');
      setTimeout(function(){ location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); }, 1000);
      return;
    }
    if(!text || !text.trim()) return;
    sendBtn.disabled = true;
    fetch(base + 'api/support/chat', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content: text.trim()})
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      sendBtn.disabled = false;
      if(j.ok){
        input.value = '';
        loadHistory().catch(function(){ BTCBOX.toast(I18N.t('supportHistoryRefreshFailed'), 'warning'); });
      } else {
        BTCBOX.toast(I18N.t('messageSendFailed'), 'error');
      }
    })
    .catch(function(){
      sendBtn.disabled = false;
      BTCBOX.toast((window.I18N?I18N.t('networkErr'):''), 'error');
    });
  }
  sendBtn.addEventListener('click', function(){ sendMsg(input.value); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(input.value); }
  });
  document.querySelectorAll('.quick-q').forEach(function(q){
    q.addEventListener('click', function(){
      sendMsg((window.I18N && I18N.getLang() === 'zh-CN') ? q.dataset.q : (q.dataset.qEn || q.dataset.q));
    });
  });
  // 初始化
  if(BTCBOX.isLoggedIn()){
    loadHistory();
    polling = setInterval(poll, 3000);
  } else {
    body.innerHTML = '<div class="chat-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.4;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div>' + I18N.t('loginToContactSupport') + '</div><a class="btn btn-sm btn-gold" href="login.html?redirect=' + encodeURIComponent(location.pathname) + '" style="margin-top:8px;">' + I18N.t('goLogin') + '</a></div>';
    input.disabled = true;
    input.placeholder = I18N.t('loginToSendMessage');
    sendBtn.disabled = true;
  }
})();
</script>
<div data-active="me" id="bottomNavSlot"></div>
<script src="../assets/js/app.js"></script>
<script>
  // 三级页面底部导航
  document.addEventListener('DOMContentLoaded', function(){
    if(window.BTCBOX && BTCBOX.renderBottomNav){
      var path = location.pathname;
      var active = 'me';
      if(path.indexOf('kyc')>-1) active='me';
      if(path.indexOf('support')>-1) active='me';
      if(path.indexOf('legal')>-1) active='me';
      BTCBOX.renderBottomNav(active);
    }
  });
</script>
</body>
</html>
