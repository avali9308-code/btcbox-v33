<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>在线客服 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 56px);height:calc(100dvh - 56px);max-width:520px;margin:0 auto;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;}
  .chat-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;position:relative;}
  .chat-online{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#0ecb81;border:2px solid var(--card);}
  .chat-title{font-size:14px;font-weight:700;}
  .chat-sub{font-size:11px;color:#0ecb81;margin-top:2px;display:flex;align-items:center;gap:5px;}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);}
  .chat-date{text-align:center;font-size:10px;color:var(--text-3);padding:4px 0;}
  .msg-row{display:flex;gap:8px;max-width:85%;animation:msgIn .3s ease;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
  .msg-row.admin{align-self:flex-start;}
  .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
  .msg-row.admin .msg-avatar{background:var(--gold-soft);color:var(--gold);}
  .msg-row.user .msg-avatar{background:var(--bg-2);color:var(--text-2);}
  .msg-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word;}
  .msg-row.admin .msg-bubble{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text);}
  .msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#0a0e1a;font-weight:600;border-top-right-radius:4px;}
  .msg-time{font-size:10px;color:var(--text-3);margin-top:4px;text-align:right;}
  .msg-row.admin .msg-time{text-align:left;}
  .quick-qs{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;flex-shrink:0;}
  .quick-q{padding:7px 14px;border-radius:18px;background:var(--bg-2);border:1px solid var(--border);font-size:12px;color:var(--text-2);cursor:pointer;transition:all .2s;}
  .quick-q:hover{border-color:var(--gold);color:var(--gold);}
  .chat-input-wrap{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .chat-input{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text);font-size:16px;outline:none;}
  .chat-input:focus{border-color:var(--gold);}
  .chat-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:#0a0e1a;}
  .chat-send:disabled{opacity:.4;cursor:not-allowed;}
  .typing{display:inline-flex;gap:3px;padding:10px 14px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:typing 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
  .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;gap:10px;padding:40px;text-align:center;}
</style>
</head>
<body style="overflow:hidden;height:100vh;">
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="page-title">在线客服</span>
    </div>
  </header>
  <div class="chat-wrap">
    <div class="chat-head">
      <div class="chat-avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div class="chat-online"></div>
      </div>
      <div>
        <div class="chat-title">BTCBOX 专属客服</div>
        <div class="chat-sub"><span class="pulse-dot" style="background:#0ecb81;"></span>在线 · 工作时间内尽快回复</div>
      </div>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="chat-empty" id="chatEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div>暂无对话，发送消息开始咨询</div>
      </div>
    </div>
    <div class="quick-qs" id="quickQs">
      <div class="quick-q" data-q="如何充值数字资产？">如何充值？</div>
      <div class="quick-q" data-q="提币多久能到账？">提币到账时间</div>
      <div class="quick-q" data-q="如何完成身份认证(KYC)？">KYC 认证</div>
      <div class="quick-q" data-q="忘记密码怎么办？">忘记密码</div>
      <div class="quick-q" data-q="交易费率是多少？">交易费率</div>
    </div>
    <div class="chat-input-wrap">
      <input class="chat-input" id="chatInput" placeholder="请输入您的问题..." maxlength="500">
      <button class="chat-send" id="chatSend" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var body = document.getElementById('chatBody');
  var empty = document.getElementById('chatEmpty');
  var input = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');
  var lastMsgId = 0;
  var polling = null;
  var inPages = location.pathname.indexOf('/pages/') > -1;
  var base = inPages ? '../' : '';

  function fmtTime(t){
    if(!t) return '';
    var parts = t.split(' ');
    return parts.length > 1 ? parts[1].slice(0,5) : t;
  }
  function appendMsg(m){
    if(empty){ empty.remove(); empty = null; }
    var row = document.createElement('div');
    row.className = 'msg-row ' + (m.from_admin ? 'admin' : 'user');
    var avatar = m.from_admin ? '客' : '我';
    row.innerHTML = '<div class="msg-avatar">' + avatar + '</div>' +
      '<div><div class="msg-bubble"></div><div class="msg-time">' + fmtTime(m.time) + '</div></div>';
    row.querySelector('.msg-bubble').textContent = m.content;
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }
  function showTyping(){
    var row = document.createElement('div');
    row.className = 'msg-row admin';
    row.id = 'typingRow';
    row.innerHTML = '<div class="msg-avatar">客</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }
  function hideTyping(){
    var t = document.getElementById('typingRow');
    if(t) t.remove();
  }
  function loadHistory(){
    fetch(base + 'api/support/messages', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.ok && j.messages && j.messages.length){
          j.messages.forEach(function(m){
            if(m.id > lastMsgId){ lastMsgId = m.id; appendMsg(m); }
          });
        }
      }).catch(function(){});
  }
  function poll(){
    fetch(base + 'api/support/messages', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.ok && j.messages){
          var newMsgs = j.messages.filter(function(m){ return m.id > lastMsgId; });
          if(newMsgs.length){
            hideTyping();
            newMsgs.forEach(function(m){ lastMsgId = m.id; appendMsg(m); });
          }
        }
      }).catch(function(){});
  }
  function sendMsg(text){
    if(!BTCBOX.isLoggedIn()){
      BTCBOX.toast('请先登录后联系客服', 'warning');
      setTimeout(function(){ location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); }, 1000);
      return;
    }
    if(!text || !text.trim()) return;
    sendBtn.disabled = true;
    fetch(base + 'api/support/chat', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content: text.trim()})
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      sendBtn.disabled = false;
      if(j.ok){
        appendMsg(j.message);
        lastMsgId = j.message.id;
        input.value = '';
        setTimeout(showTyping, 600);
      } else {
        BTCBOX.toast(j.msg || '发送失败', 'error');
      }
    })
    .catch(function(){
      sendBtn.disabled = false;
      BTCBOX.toast('网络异常，请稍后重试', 'error');
    });
  }
  sendBtn.addEventListener('click', function(){ sendMsg(input.value); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(input.value); }
  });
  document.querySelectorAll('.quick-q').forEach(function(q){
    q.addEventListener('click', function(){
      sendMsg(q.dataset.q);
    });
  });
  // 初始化
  if(BTCBOX.isLoggedIn()){
    loadHistory();
    polling = setInterval(poll, 3000);
  } else {
    body.innerHTML = '<div class="chat-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.4;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div>请先登录后联系在线客服</div><a class="btn btn-sm btn-gold" href="login.html?redirect=' + encodeURIComponent(location.pathname) + '" style="margin-top:8px;">去登录</a></div>';
    input.disabled = true;
    input.placeholder = '登录后可发送消息';
    sendBtn.disabled = true;
  }
})();
</script>

<div id="bottomNavSlot" data-active="me"></div>
</body>
</html>
