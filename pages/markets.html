<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<link href="../assets/img/logo-transparent.png" rel="icon" type="image/png"/>
<meta content="#0a0e1a" name="theme-color"/>
<title data-i18n="r131_183">行情 · BTCBOX</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app">
<header class="header">
<div style="display:flex;align-items:center;gap:10px;flex:1;">
<a class="header-back" href="javascript:history.back()" onclick="if(history.length&lt;=1){location.href='../index.html';return false;}">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<span class="page-title"><span data-i18n="r131_184">行情</span></span>
</div>
</header>
<div class="content">
<!-- 搜索 -->
<div style="position:relative;margin:4px 0 14px;">
<svg fill="none" height="16" stroke="#5a6478" stroke-linecap="round" stroke-width="2" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);" viewbox="0 0 24 24" width="16"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input class="form-input" data-i18n-placeholder="r131_192" id="searchInput" placeholder="搜索币种 / 交易对" style="padding-left:40px;" type="text"/>
</div>
<div class="tabs" id="mTabs">
<button class="tab active" data-tab="all">USDT</button>
<button class="tab" data-tab="gainers"><span data-i18n="r131_186">涨幅榜</span></button>
<button class="tab" data-tab="losers"><span data-i18n="r131_187">跌幅榜</span></button>
<button class="tab" data-tab="fav"><span data-i18n="r131_188">自选</span></button>
</div>
<div class="list-head"><span><span data-i18n="r131_5">币种</span></span><span style="text-align:right;"><span data-i18n="r131_189">最新价</span></span><span style="text-align:right;"><span data-i18n="r131_190">24h涨跌</span></span><span style="text-align:right;"><span data-i18n="r131_191">24h额</span></span></div>
<div id="fullMarketList"></div>
</div>
<div style="height:16px;"></div>
<div data-active="markets" id="bottomNavSlot"></div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var curTab = 'all', keyword = '';
  function render(){
    var list = BTCBOX.markets.slice();
    if(curTab==='gainers') list.sort(function(a,b){return b.chg-a.chg;});
    else if(curTab==='losers') list.sort(function(a,b){return a.chg-b.chg;});
    else if(curTab==='fav') list = list.filter(function(m){return ['BTC','ETH','SOL','LINK'].indexOf(m.sym)>=0;});
    if(keyword){
      var k = keyword.toUpperCase();
      list = list.filter(function(m){ return m.sym.indexOf(k)>=0 || m.name.toUpperCase().indexOf(k)>=0; });
    }
    var el = document.getElementById('fullMarketList');
    el.innerHTML = list.map(function(m){
      var up = m.chg>=0;
      return '<div class="market-row" onclick="location.href=\'trade.html?symbol='+m.sym+'USDT\'">'+
        '<div style="display:flex;align-items:center;gap:9px;">'+BTCBOX.coinIconHtml(m.sym,32)+
        '<div><div style="font-size:13px;font-weight:700;">'+m.sym+'<span style="color:var(--text-3);font-weight:500;font-size:10px;margin-left:4px;">/USDT</span></div>'+
        '<div style="font-size:10px;color:var(--text-3);margin-top:1px;">'+m.name+'</div></div></div>'+
        '<div class="num" style="text-align:right;font-size:13px;font-weight:700;">'+BTCBOX.fmtPrice(m.price)+'</div>'+
        '<div style="text-align:right;"><span class="chg-pill num '+(up?'chg-up':'chg-down')+'">'+(up?'+':'')+m.chg.toFixed(2)+'%</span></div>'+
        '<div class="num" style="text-align:right;font-size:11px;color:var(--text-3);">'+m.vol+'</div></div>';
    }).join('') || '<div class="empty-state"><p>未找到相关币种</p></div>';
  }
  render();
  document.addEventListener('marketTick', render);
  document.querySelectorAll('#mTabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#mTabs .tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curTab = t.getAttribute('data-tab'); render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', function(){
    keyword = this.value.trim(); render();
  });
})();
</script>
</body>
</html>
