<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>行情 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;flex:1;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="page-title">行情</span>
    </div>

  </header>

  <div class="content">
    <!-- 搜索 -->
    <div style="position:relative;margin:4px 0 14px;">
      <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5a6478" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" class="form-input" type="text" placeholder="搜索币种 / 交易对" style="padding-left:40px;">
    </div>

    <div class="tabs" id="mTabs">
      <button class="tab active" data-tab="all">USDT</button>
      <button class="tab" data-tab="gainers">涨幅榜</button>
      <button class="tab" data-tab="losers">跌幅榜</button>
      <button class="tab" data-tab="fav">自选</button>
    </div>
    <div class="list-head"><span>币种</span><span style="text-align:right;">最新价</span><span style="text-align:right;">24h涨跌</span><span style="text-align:right;">24h额</span></div>
    <div id="fullMarketList"></div>
  </div>

  <div style="height:16px;"></div>
  <div id="bottomNavSlot" data-active="markets"></div>
</div>

<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var curTab = 'all', keyword = '';
  function render(){
    var list = BTCBOX.markets.slice();
    if(curTab==='gainers') list.sort(function(a,b){return b.chg-a.chg;});
    else if(curTab==='losers') list.sort(function(a,b){return a.chg-b.chg;});
    else if(curTab==='fav') list = list.filter(function(m){return ['BTC','ETH','SOL','LINK'].indexOf(m.sym)>=0;});
    if(keyword){
      var k = keyword.toUpperCase();
      list = list.filter(function(m){ return m.sym.indexOf(k)>=0 || m.name.toUpperCase().indexOf(k)>=0; });
    }
    var el = document.getElementById('fullMarketList');
    el.innerHTML = list.map(function(m){
      var up = m.chg>=0;
      return '<div class="market-row" onclick="location.href=\'trade.html?symbol='+m.sym+'USDT\'">'+
        '<div style="display:flex;align-items:center;gap:9px;">'+BTCBOX.coinIconHtml(m.sym,32)+
        '<div><div style="font-size:13px;font-weight:700;">'+m.sym+'<span style="color:var(--text-3);font-weight:500;font-size:10px;margin-left:4px;">/USDT</span></div>'+
        '<div style="font-size:10px;color:var(--text-3);margin-top:1px;">'+m.name+'</div></div></div>'+
        '<div class="num" style="text-align:right;font-size:13px;font-weight:700;">'+BTCBOX.fmtPrice(m.price)+'</div>'+
        '<div style="text-align:right;"><span class="chg-pill num '+(up?'chg-up':'chg-down')+'">'+(up?'+':'')+m.chg.toFixed(2)+'%</span></div>'+
        '<div class="num" style="text-align:right;font-size:11px;color:var(--text-3);">'+m.vol+'</div></div>';
    }).join('') || '<div class="empty-state"><p>未找到相关币种</p></div>';
  }
  render();
  document.addEventListener('marketTick', render);
  document.querySelectorAll('#mTabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#mTabs .tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curTab = t.getAttribute('data-tab'); render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', function(){
    keyword = this.value.trim(); render();
  });
})();
</script>
</body>
</html>
