<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f0b90b'/%3E%3Ctext x='50' y='70' font-size='62' font-weight='900' text-anchor='middle' fill='%230a0e1a' font-family='Arial,Helvetica,sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0a0e1a">
<title>订单 · BTCBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="header-back" href="javascript:history.back()" onclick="if(history.length<=1){location.href='../index.html';return false;}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span class="page-title">订单记录</span>
    </div>
  </header>
  <div class="content">
    <div class="tabs" id="orderTabs">
      <button class="tab active" data-otab="open">当前委托</button>
      <button class="tab" data-otab="history">历史委托</button>
      <button class="tab" data-otab="trade">成交记录</button>
    </div>
    <div id="orderList">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <p>暂无委托记录</p>
        <a href="trade.html?symbol=BTCUSDT" style="display:inline-block;margin-top:14px;padding:10px 24px;background:var(--gold);color:#0a0e1a;border-radius:10px;font-size:13px;font-weight:700;">去交易</a>
      </div>
    </div>
  </div>
  <div style="height:20px;"></div>
  <div id="bottomNavSlot" data-active="me"></div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var curTab = 'open';
  function renderOrders(){
    var listEl = document.getElementById('orderList');
    if(!BTCBOX.isLoggedIn()){
      listEl.innerHTML = '<div class="empty-state"><p>登录后查看订单记录</p><a class="btn btn-sm btn-gold" href="login.html?redirect='+encodeURIComponent(location.pathname)+'" style="display:inline-block;margin-top:10px;">去登录</a></div>';
      return;
    }
    fetch('../api/account', {credentials:'include'})
      .then(function(r){return r.json();})
      .then(function(j){
        var orders = (j.ok && j.orders) ? j.orders : [];
        if(!orders.length){
          listEl.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.4;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>暂无委托记录</p><a href="trade.html?symbol=BTCUSDT" style="display:inline-block;margin-top:14px;padding:10px 24px;background:var(--gold);color:#0a0e1a;border-radius:10px;font-size:13px;font-weight:700;">去交易</a></div>';
          return;
        }
        var ST = {open:['未成交','#f0b90b'], filled:['已成交','#0ecb81'], cancelled:['已取消','#5a6478'], rejected:['已拒绝','#f6465d']};
        listEl.innerHTML = orders.slice().reverse().map(function(o){
          var s = ST[o.status] || ['处理中','#f0b90b'];
          return '<div class="record-row"><div class="record-row-top"><span style="font-weight:700;font-size:13px;">'+(o.symbol||'BTC/USDT')+' · '+(o.side==='buy'?'买入':'卖出')+'</span><span style="padding:2px 8px;border-radius:6px;background:'+s[1]+'22;color:'+s[1]+';font-size:11px;font-weight:700;">'+s[0]+'</span></div><div class="record-row-bottom"><span class="num">'+BTCBOX.fmtNum(o.qty||0,6)+' @ '+BTCBOX.fmtNum(o.price||0)+'</span><span>合计 '+BTCBOX.fmtNum(o.total||0)+' USDT</span><span>'+(o.time||'')+'</span></div></div>';
        }).join('');
      }).catch(function(){
        listEl.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
      });
  }
  document.querySelectorAll('#orderTabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#orderTabs .tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curTab = t.getAttribute('data-otab'); renderOrders();
    });
  });
  renderOrders();
  document.addEventListener('accountChange', renderOrders);
})();
</script>
</body>
</html>
