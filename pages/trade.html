<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<link href="../assets/img/logo-transparent.png" rel="icon" type="image/png"/>
<meta content="#0a0e1a" name="theme-color"/>
<title data-i18n="r131_214">交易 · BTCBOX</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
<style>
  .trade-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
  .pair-name{font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .pair-name span{color:var(--text-3);font-size:12px;font-weight:500;}
  .price-strip{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
  .price-strip::-webkit-scrollbar{display:none;}
  .price-strip .cur{font-size:20px;font-weight:800;letter-spacing:-.02em;flex-shrink:0;}
  .price-strip .stat{font-size:10px;color:var(--text-3);flex-shrink:0;white-space:nowrap;}
  .price-strip .stat b{display:block;font-size:11px;color:var(--text);font-weight:600;margin-top:1px;}
  .trade-main{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;padding:12px 16px;}
  .order-panel{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .mode-row{display:flex;gap:14px;margin-bottom:2px;}
  .mode-btn{background:none;border:none;color:var(--text-3);font-size:11px;font-weight:600;padding:0 0 3px;border-bottom:2px solid transparent;cursor:pointer;}
  .mode-btn.active{color:var(--text);border-bottom-color:var(--gold);font-weight:700;}
  .mini-input{display:flex;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:7px 10px;}
  .mini-input label{font-size:10px;color:var(--text-3);}
  .mini-input input{background:none;border:none;color:var(--text);font-size:16px;font-weight:700;text-align:right;max-width:90px;flex:1;min-width:0;outline:none;}
  .mini-input .unit{font-size:10px;color:var(--text-3);margin-left:3px;}
  .pct-row{display:flex;gap:5px;}
  .pct-btn{flex:1;padding:5px 0;background:var(--bg-2);border:1px solid var(--border);border-radius:7px;color:var(--text-2);font-size:10px;font-weight:600;cursor:pointer;}
  .pct-btn:active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);}
  .avail-row{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);}
  .avail-row b{color:var(--text-2);font-weight:600;}
  .confirm-btn{height:38px;border-radius:10px;font-size:14px;font-weight:700;color:#0a0e1a;border:none;cursor:pointer;width:100%;}
  .confirm-btn.buy{background:linear-gradient(135deg,var(--up),#0bb570);}
  .confirm-btn.sell{background:linear-gradient(135deg,var(--down),#d63a50);color:#fff;}
  .ob-panel{display:flex;flex-direction:column;min-width:0;}
  .ob-title{display:flex;justify-content:space-between;font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;padding:0 2px;}
  .ob-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;}
  .ob-row{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:10px;padding:1.5px 2px;position:relative;cursor:pointer;}
  .ob-row:active{background:rgba(139,154,184,.1);}
  .ob-row .p{font-weight:700;text-align:left;}
  .ob-row .q{color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums;}
  .ob-row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.1;z-index:0;}
  .ob-row span{position:relative;z-index:1;}
  .ob-asks .p{color:var(--down);}
  .ob-bids .p{color:var(--up);}
  .ob-mid{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:3px 0;}
  .ob-mid .mid-price{font-size:14px;font-weight:800;}
  .ob-mid .mid-unit{font-size:9px;color:var(--text-3);}
  .order-tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
  .order-tabs::-webkit-scrollbar{display:none;}
  .order-tab{flex-shrink:0;padding:10px 12px;font-size:12px;color:var(--text-3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;background:none;}
  .order-tab.active{color:var(--text);border-bottom-color:var(--gold);}
  .order-body{padding:8px 16px;min-height:110px;}
  .record-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .record-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .record-row-bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);}
  .drawer-handle{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--gold);font-weight:600;cursor:pointer;z-index:40;}
  .drawer-handle svg{width:16px;height:16px;}
  .kline-drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:min(100%,520px);min-width:0;max-width:520px;height:92vh;height:92dvh;max-height:100dvh; padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--gold);z-index:100;transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6);}
  .kline-drawer.open{transform:translateX(-50%) translateY(0);}
  @media(max-width:767px){.kline-drawer{width:100%;max-width:none;left:0;transform:translateY(100%);border-radius:16px 16px 0 0;} .kline-drawer.open{transform:translateY(0);}}
  .trade-orders-col{display:flex;flex-direction:column;}
  .trade-orders-col .order-body{max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  @media(min-width:768px){
    .kline-drawer{left:auto;right:0;top:0;bottom:auto;width:50vw;max-width:900px;height:100vh;transform:translateX(100%);border-radius:16px 0 0 16px;border-top:none;border-left:1px solid var(--gold);}
    .kline-drawer.open{transform:translateX(0);}
    .trade-orders-col .order-body{max-height:none;}
  }
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);}
  .drawer-head .title{font-size:14px;font-weight:700;}
  .drawer-close{width:28px;height:28px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;border:none;}
  .chart-tabs{display:flex;gap:2px;padding:8px 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
  .chart-tabs::-webkit-scrollbar{display:none;}
  .chart-tab{flex-shrink:0;padding:5px 10px;border-radius:7px;font-size:11px;color:var(--text-3);font-weight:600;border:none;background:none;cursor:pointer;}
  .chart-tab.active{background:var(--gold-soft);color:var(--gold);}
  .drawer-canvas-wrap{flex:1;position:relative;padding:8px 0;min-height:0;}
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;}
  .drawer-mask.show{opacity:1;pointer-events:auto;}
  .empty-state{padding:30px 0;text-align:center;color:var(--text-3);font-size:12px;}
  .empty-state svg{width:36px;height:36px;margin-bottom:8px;opacity:.4;}
</style>
</head>
<body>
<div class="app trade-app">
<div class="trade-top">
<div style="display:flex;align-items:center;gap:10px;">
<a class="header-back" href="javascript:history.back()">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<div>
<div class="pair-name" id="pairName">BTC<span>/USDT</span></div>
<div id="pairFullName" style="font-size:10px;color:var(--text-3);margin-top:1px;">Bitcoin</div>
</div>
</div>
<button id="klineBtn" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--gold-soft);border:1px solid rgba(46,174,112,.45);color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:auto;">
<svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24" width="15"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
<span data-i18n="r131_215">图表</span>
</button>
<a aria-label="切换交易对" class="icon-btn" data-i18n-aria-label="r131_237" href="markets.html">
<svg fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
</a>
</div>
<div class="price-strip">
<span class="cur num text-up" id="curPrice">--</span>
<span class="num" id="curChg" style="font-size:13px;font-weight:700;flex-shrink:0;">--</span>
<span class="stat"><span data-i18n="r131_216">24h最高</span><b class="num" id="high24">--</b></span>
<span class="stat"><span data-i18n="r131_217">24h最低</span><b class="num" id="low24">--</b></span>
<span class="stat"><span data-i18n="r131_191">24h额</span><b class="num" id="vol24">--</b></span>
</div>
<div class="trade-main">
<div class="order-panel">
<div class="seg">
<button class="seg-btn active-buy" id="sideBuy"><span data-i18n="r131_218">'+I18N.t('buy')+'</span></button>
<button class="seg-btn" id="sideSell"><span data-i18n="r131_219">'+I18N.t('sell')+'</span></button>
</div>
<div class="mode-row">
<button class="mode-btn active" id="modeLimit"><span data-i18n="r131_220">限价</span></button>
<button class="mode-btn" id="modeMarket"><span data-i18n="r131_221">市价</span></button>
</div>
<div class="mini-input">
<label><span data-i18n="r131_222">价格</span></label>
<div style="display:flex;align-items:center;">
<input class="num" id="priceInput" inputmode="decimal" step="any" type="number" value=""/>
<span class="unit">USDT</span>
</div>
</div>
<div class="mini-input">
<label><span data-i18n="r131_104">数量</span></label>
<div style="display:flex;align-items:center;">
<input class="num" id="amountInput" inputmode="decimal" step="any" type="number" value="0.01"/>
<span class="unit" id="amountUnit">BTC</span>
</div>
</div>
<div class="pct-row">
<button class="pct-btn" data-pct="25">25%</button>
<button class="pct-btn" data-pct="50">50%</button>
<button class="pct-btn" data-pct="75">75%</button>
<button class="pct-btn" data-pct="100"><span data-i18n="r131_223">最大</span></button>
</div>
<div class="avail-row">
<span><span data-i18n="r131_99">可用</span> <b class="num" id="available">0.00</b> <span id="availUnit">USDT</span></span>
<span><span data-i18n="r131_224">合计</span> <b class="num" id="totalCalc">--</b> USDT</span>
</div>
<button class="confirm-btn buy" id="confirmBtn"><span data-i18n="r131_225">确认'+I18N.t('buy')+' BTC</span></button>
</div>
<div class="ob-panel">
<div class="ob-title"><span><span data-i18n="r131_226">价格(USDT)</span></span><span><span data-i18n="amountParen">数量(</span><span id="obUnit">BTC</span>)</span></div>
<div class="ob-list">
<div class="ob-asks" id="asks" style="display:flex;flex-direction:column;justify-content:flex-end;flex:1;"></div>
<div class="ob-mid">
<span class="mid-price num text-up" id="midPrice">--</span>
<span class="mid-unit num" id="midUnit">USDT</span>
</div>
<div class="ob-bids" id="bids" style="display:flex;flex-direction:column;flex:1;justify-content:flex-start;"></div>
</div>
</div>
</div>
<div class="trade-orders-col">
<div class="order-tabs" id="orderTabs">
<button class="order-tab active" data-otab="open"><span data-i18n="r131_227">当前委托</span></button>
<button class="order-tab" data-otab="position"><span data-i18n="r131_228">持仓</span></button>
<button class="order-tab" data-otab="history"><span data-i18n="r131_229">历史成交</span></button>
</div>
<div class="order-body" id="orderBody">
<div class="empty-state" id="orderEmpty">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" x2="16" y1="13" y2="13"></line><line x1="8" x2="13" y1="17" y2="17"></line></svg>
<p id="emptyText"><span data-i18n="r131_230">'+I18N.t('tradeNoOpenOrders')+'</span></p>
</div>
</div>
</div>
<div data-active="trade" id="bottomNavSlot"></div>
</div>
<div class="drawer-mask" id="drawerMask"></div>
<div class="kline-drawer" id="klineDrawer">
<div class="drawer-head">
<span class="title" id="drawerTitle"><span data-i18n="r131_182">BTC/USDT · K线</span></span>
<button aria-label="关闭" class="drawer-close" data-i18n-aria-label="r131_238" id="drawerClose">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-width="2.4" viewbox="0 0 24 24" width="16"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</div>
<div class="chart-tabs" id="chartTabs">
<button class="chart-tab"><span data-i18n="r131_231">分时</span></button>
<button class="chart-tab active" data-interval="15m"><span data-i18n="r131_232">15分</span></button>
<button class="chart-tab" data-interval="1h"><span data-i18n="r131_233">1小时</span></button>
<button class="chart-tab" data-interval="4h"><span data-i18n="r131_234">4小时</span></button>
<button class="chart-tab" data-interval="1d"><span data-i18n="r131_235">日线</span></button>
<button class="chart-tab" data-interval="1w"><span data-i18n="r131_236">周线</span></button>
</div>
<div class="drawer-canvas-wrap">
<canvas id="kline" style="width:100%;height:100%;display:block;"></canvas>
</div>
</div>
<script src="../assets/js/market-api.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var symbol = (params.get('symbol') || 'BTCUSDT').toUpperCase();
  var baseSym = symbol.replace('USDT','');
  var coin = BTCBOX.markets.find(function(m){return m.sym===baseSym;}) || BTCBOX.markets[0];

  document.getElementById('pairName').innerHTML = coin.sym + '<span>/USDT</span>';
  document.getElementById('pairFullName').textContent = coin.name;
  document.getElementById('drawerTitle').textContent = coin.sym + '/USDT · K线';
  document.title = coin.sym + '/USDT 交易 · BTCBOX';
  document.getElementById('amountUnit').textContent = coin.sym;
  document.getElementById('obUnit').textContent = coin.sym;

  var live = window.MarketAPI ? MarketAPI.getMarket(baseSym) : null;
  var initPrice = (live && live.price) ? live.price : coin.price;
  document.getElementById('priceInput').value = initPrice;
  document.getElementById('curPrice').textContent = BTCBOX.fmtPrice(initPrice);
  document.getElementById('midPrice').textContent = BTCBOX.fmtPrice(initPrice);
  document.getElementById('midUnit').textContent = 'USDT';
  var up = (live ? live.chg : coin.chg) >= 0;
  document.getElementById('curPrice').className = 'cur num ' + (up?'text-up':'text-down');
  document.getElementById('midPrice').className = 'mid-price num ' + (up?'text-up':'text-down');
  document.getElementById('curChg').textContent = (up?'+':'') + (live?live.chg:coin.chg).toFixed(2) + '%';
  document.getElementById('curChg').style.color = up ? 'var(--up)' : 'var(--down)';
  if(live){
    document.getElementById('high24').textContent = BTCBOX.fmtPrice(live.high);
    document.getElementById('low24').textContent = BTCBOX.fmtPrice(live.low);
    document.getElementById('vol24').textContent = live.vol || '--';
  }

  var klineData = [];
  var drawerOpen = false;
  function drawKlineNow(){
    var c = document.getElementById('kline');
    if(!c || c.clientHeight < 10 || !klineData.length) return;
    BTCBOX.drawKline('kline', klineData);
  }
  if(window.MarketAPI){
    function refreshKline(){
      MarketAPI.getKline(symbol).then(function(data){
        if(data && data.length){
          klineData = data.map(function(d){ return [d[1], d[4], d[3], d[2], d[5]]; });
          if(drawerOpen) drawKlineNow();
        }
      }).catch(function(){});
    }
    refreshKline();
    setInterval(refreshKline, 30000); // 每30秒刷新真实K线数据
  }

  var drawer = document.getElementById('klineDrawer');
  var mask = document.getElementById('drawerMask');
  function openDrawer(){
    drawerOpen = true;
    drawer.classList.add('open');
    mask.classList.add('show');
    setTimeout(drawKlineNow, 350);
  }
  function closeDrawer(){
    drawerOpen = false;
    drawer.classList.remove('open');
    mask.classList.remove('show');
  }
  document.getElementById('klineBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  mask.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });

  document.querySelectorAll('#chartTabs .chart-tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#chartTabs .chart-tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      // 切换周期时拉取真实K线；数据源不可用时不伪造数据
      if(window.MarketAPI){
        var interval = t.getAttribute('data-interval') || '15m';
        MarketAPI.getKline(symbol, interval).then(function(data){
          if(data && data.length){
            klineData = data.map(function(d){ return [d[1], d[4], d[3], d[2], d[5]]; });
            drawKlineNow();
          } else {
            klineData = [];
            drawKlineNow();
          }
        }).catch(function(){ klineData = []; drawKlineNow(); });
      } else {
        klineData = [];
        drawKlineNow();
      }
    });
  });

  var lastDepth = null;
  function renderOB(depth){
    if(depth) lastDepth = depth; else depth = lastDepth;
    var p = initPrice;
    var asks, bids;
    if(depth){
      asks = depth.asks.slice(0,6).map(function(a){return {price:parseFloat(a[0]), vol:parseFloat(a[1])};});
      bids = depth.bids.slice(0,6).map(function(b){return {price:parseFloat(b[0]), vol:parseFloat(b[1])};});
    } else {
      asks=[]; bids=[];
    }
    var maxVol = 1;
    asks.concat(bids).forEach(function(o){ maxVol = Math.max(maxVol, o.vol); });
    function row(o, side){
      var w = Math.min(100, (o.vol/maxVol*100)).toFixed(0);
      var col = side==='ask' ? 'var(--down)' : 'var(--up)';
      return '<div class="ob-row" onclick="var el=document.getElementById(\'priceInput\');el.value='+o.price.toFixed(2)+';el.dispatchEvent(new Event(\'input\'));">'+
        '<span class="p num">'+BTCBOX.fmtPrice(o.price)+'</span>'+
        '<span class="q num">'+o.vol.toFixed(4)+'</span>'+
        '<div class="bar" style="width:'+w+'%;background:'+col+';"></div></div>';
    }
    document.getElementById('asks').innerHTML = asks.map(function(o){return row(o,'ask');}).join('');
    document.getElementById('bids').innerHTML = bids.map(function(o){return row(o,'bid');}).join('');
  }
  renderOB();
  if(window.MarketAPI){
    MarketAPI.getDepth(symbol).then(function(d){ renderOB(d); }).catch(function(){});
    setInterval(function(){ MarketAPI.getDepth(symbol).then(function(d){ renderOB(d); }).catch(function(){}); }, 3000);
  }

  var side = 'buy', mode = 'limit';
  var realBalances = {};
  function loadRealBalances(){
    if(!BTCBOX.isLoggedIn()) return;
    fetch('../api/account', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.ok && j.balances){
          realBalances = j.balances;
          // 更新当前显示的可用余额
          if(side === 'buy'){
            document.getElementById('available').textContent = BTCBOX.fmtNum((realBalances.USDT||{}).amount || 0);
          } else {
            document.getElementById('available').textContent = BTCBOX.fmtNum((realBalances[baseSym]||{}).amount || 0, 6);
            document.getElementById('availUnit').textContent = baseSym;
          }
        }
      }).catch(function(){});
  }
  loadRealBalances();
  document.addEventListener('accountChange', loadRealBalances);
  var priceInput = document.getElementById('priceInput');
  var amountInput = document.getElementById('amountInput');
  function recalc(){
    var p = mode==='market' ? initPrice : parseFloat(priceInput.value)||0;
    var a = parseFloat(amountInput.value)||0;
    document.getElementById('totalCalc').textContent = BTCBOX.fmtNum(p*a);
  }
  recalc();
  function updateBtn(){
    var btn = document.getElementById('confirmBtn');
    if(side==='buy'){ btn.className='confirm-btn buy'; btn.textContent=I18N.t('tradeBuyConfirm')+' '+coin.sym; }
    else { btn.className='confirm-btn sell'; btn.textContent=I18N.t('tradeSellConfirm')+' '+coin.sym; }
  }
  document.getElementById('sideBuy').addEventListener('click', function(){
    side='buy'; this.classList.add('active-buy');
    document.getElementById('sideSell').classList.remove('active-sell');
    document.getElementById('available').textContent = BTCBOX.fmtNum((realBalances.USDT||{}).amount || 0);
    document.getElementById('availUnit').textContent = 'USDT';
    updateBtn();
  });
  document.getElementById('sideSell').addEventListener('click', function(){
    side='sell'; this.classList.add('active-sell');
    document.getElementById('sideBuy').classList.remove('active-buy');
    document.getElementById('available').textContent = BTCBOX.fmtNum((realBalances[baseSym]||{}).amount || 0, 6);
    document.getElementById('availUnit').textContent = coin.sym;
    updateBtn();
  });
  document.getElementById('modeLimit').addEventListener('click', function(){
    mode='limit'; this.classList.add('active');
    document.getElementById('modeMarket').classList.remove('active');
    priceInput.disabled=false; priceInput.style.opacity='1';
    if(!priceInput.value) priceInput.value = initPrice;
    recalc();
  });
  document.getElementById('modeMarket').addEventListener('click', function(){
    // The server-side matching contract currently accepts limit orders only.
    BTCBOX.toast(I18N.t('marketOrdersUnavailable'), 'warning');
    mode='limit';
    document.getElementById('modeLimit').classList.add('active');
    this.classList.remove('active');
    priceInput.disabled=false; priceInput.style.opacity='1';
    if(!priceInput.value) priceInput.value=initPrice;
    recalc();
  });
  priceInput.addEventListener('input', function(){ this.dataset.touched='1'; recalc(); });
  amountInput.addEventListener('input', recalc);
  document.querySelectorAll('.pct-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var pct = parseInt(b.dataset.pct)/100;
      var p = mode==='market' ? initPrice : parseFloat(priceInput.value)||initPrice;
      var availAmt = side==='buy' ? ((realBalances.USDT||{}).amount || 0) : ((realBalances[baseSym]||{}).amount || 0);
      amountInput.value = (availAmt * pct / p).toFixed(6);
      recalc();
    });
  });
  // Reuse the same client order ID after an ambiguous network result.
  var ORDER_SUBMISSION_STORAGE_KEY = 'btcbox_pending_order_submission_v1';
  var pendingOrderSubmission = null;
  try {
    var storedOrderSubmission = JSON.parse(sessionStorage.getItem(ORDER_SUBMISSION_STORAGE_KEY) || 'null');
    if(storedOrderSubmission && typeof storedOrderSubmission.payloadKey === 'string' && /^[A-Za-z0-9_-]{16,100}$/.test(storedOrderSubmission.clientOrderId || '')) pendingOrderSubmission = storedOrderSubmission;
  } catch(e) {}
  function persistPendingOrderSubmission(){
    try { if(pendingOrderSubmission) sessionStorage.setItem(ORDER_SUBMISSION_STORAGE_KEY, JSON.stringify(pendingOrderSubmission)); else sessionStorage.removeItem(ORDER_SUBMISSION_STORAGE_KEY); } catch(e) {}
  }
  function makeClientOrderId(){
    if(window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID().replace(/-/g, '');
    return 'ord_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  document.getElementById('confirmBtn').addEventListener('click', function(){
    if(!BTCBOX.isLoggedIn()){ BTCBOX.requireLogin(); return; }
    var btn = this, a = parseFloat(amountInput.value)||0, p = parseFloat(priceInput.value)||0;
    if(!Number.isFinite(a) || a <= 0){ BTCBOX.toast(I18N.t('orderAmountInvalid'), 'warning'); return; }
    if(mode !== 'limit'){ BTCBOX.toast(I18N.t('marketOrdersUnavailable'), 'warning'); return; }
    if(!Number.isFinite(p) || p <= 0){ BTCBOX.toast(I18N.t('orderPriceInvalid'), 'warning'); return; }
    var payload = {side:side, symbol:coin.sym+'USDT', order_type:'limit', price:p, qty:a};
    var payloadKey = JSON.stringify(payload);
    if(pendingOrderSubmission && pendingOrderSubmission.payloadKey !== payloadKey){ BTCBOX.toast(I18N.t('orderOutcomeUnknown'), 'warning'); return; }
    if(!pendingOrderSubmission) pendingOrderSubmission = {payloadKey:payloadKey, clientOrderId:makeClientOrderId()};
    persistPendingOrderSubmission();
    payload.client_order_id = pendingOrderSubmission.clientOrderId;
    btn.disabled = true; btn.style.opacity = '.6';
    fetch('../api/order', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(body){return {status:r.status, body:body};}); })
      .then(function(result){
        var res=result.body||{};
        if(res.ok){ pendingOrderSubmission=null; persistPendingOrderSubmission(); BTCBOX.toast(I18N.t('orderPlaced'),'success'); loadRealBalances(); loadOrders(true); return; }
        var definitive=result.status>=400 && result.status<500;
        if(res.code==='MATCHING_ENGINE_UNAVAILABLE') definitive=true;
        if(definitive){ pendingOrderSubmission=null; persistPendingOrderSubmission(); }
        if(res.need_login || result.status===401) BTCBOX.requireLogin();
        else if(res.code==='MATCHING_ENGINE_UNAVAILABLE') BTCBOX.toast(I18N.t('orderEngineUnavailable'),'error');
        else if(!definitive) BTCBOX.toast(I18N.t('orderOutcomeUnknown'),'warning');
        else BTCBOX.toast(I18N.t('orderFailedMessage'),'error');
      }).catch(function(){ BTCBOX.toast(I18N.t('orderOutcomeUnknown'),'warning'); })
      .finally(function(){ btn.disabled=false; btn.style.opacity='1'; });
  });

  // ===== 订单记录区（复用 /api/account 的 orders，缓存去重）=====
  var cachedOrders = null;
  var ordersLoadError = false;
  var curOtab = 'open';
  var emptyTexts = {open:''+I18N.t('tradeNoOpenOrders')+'', position:''+I18N.t('tradeNoPositions')+'', history:''+I18N.t('tradeNoHistory')+''};
  function escapeOrderText(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function renderOrders(){
    var list = cachedOrders || [];
    if(ordersLoadError && cachedOrders === null){
      document.getElementById('emptyText').textContent = I18N.t('networkError');
      document.getElementById('orderEmpty').style.display = '';
      return;
    }
    var body = document.getElementById('orderBody');
    var empty = document.getElementById('orderEmpty');
    var filtered = [];
    if(curOtab === 'open'){
      filtered = list.filter(function(o){ return !['filled','canceled','cancelled'].includes(String(o.status||'').toLowerCase()); });
    } else if(curOtab === 'position'){
      filtered = list.filter(function(o){ return o.side === 'buy' && o.status === 'filled'; });
    } else {
      filtered = list.slice();
    }
    body.querySelectorAll('.record-row').forEach(function(r){ r.remove(); });
    if(!filtered.length){
      document.getElementById('emptyText').textContent = emptyTexts[curOtab] || I18N.t('noData');
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    var html = filtered.slice(0,30).map(function(o){
      var sideCol = o.side==='buy' ? 'var(--up)' : 'var(--down)';
      var sideTxt = o.side==='buy' ? ''+I18N.t('buy')+'' : ''+I18N.t('sell')+'';
      var orderStatus = String(o.status||'').toLowerCase();
      var stCls = orderStatus==='filled' ? 'status-done' : (orderStatus==='canceled' || orderStatus==='cancelled' ? 'status-cancel' : 'status-open');
      var statusLabels = {open:I18N.t('orderOpen'),partially_filled:I18N.t('orderPartiallyFilled'),filled:I18N.t('orderFilled'),canceled:I18N.t('orderCanceled'),cancelled:I18N.t('orderCanceled')};
      var stTxt = statusLabels[orderStatus] || I18N.t('orderStatusUnknown');
      var extra = '';
      if(curOtab === 'position'){
        var pnlVal = (initPrice - Number(o.price||0)) * Number(o.qty||o.quantity||0);
        extra = '<span class="num '+(pnlVal>=0?'text-up':'text-down')+'" style="font-weight:700;">'+I18N.t('floatingPnl')+' '+(pnlVal>=0?'+':'')+BTCBOX.fmtNum(pnlVal)+' USDT</span>';
      }
      return '<div class="record-row">'+
        '<div class="record-row-top"><span style="font-size:13px;font-weight:700;color:'+sideCol+';">'+sideTxt+' '+escapeOrderText(o.symbol||coin.sym+'/USDT')+'</span>'+
        '<span class="status-pill '+stCls+'">'+stTxt+'</span></div>'+
        '<div class="record-row-bottom"><span class="num">'+escapeOrderText(BTCBOX.fmtPrice(o.price||0))+'</span><span class="num">'+escapeOrderText(o.qty||o.quantity||0)+'</span><span>'+escapeOrderText(o.time||o.created_at||'')+'</span>'+extra+'</div></div>';
    }).join('');
    body.insertAdjacentHTML('afterbegin', html);
  }
  function loadOrders(force){
    if(!force && cachedOrders !== null){ renderOrders(); return; }
    fetch('../api/orders', {credentials:'include', cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('orders_unavailable'); return r.json(); })
      .then(function(j){
        if(j && j.ok && Array.isArray(j.orders)){ cachedOrders=j.orders.map(function(o){return Object.assign({},o,{qty:o.qty||o.quantity,time:o.time||o.created_at});}); }
        else throw new Error('orders_unavailable');
        ordersLoadError=false;
        renderOrders();
      }).catch(function(){
        ordersLoadError=true;
        if(cachedOrders===null) renderOrders();
      });
  }
  document.querySelectorAll('#orderTabs .order-tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#orderTabs .order-tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curOtab = t.dataset.otab;
      renderOrders();
    });
  });
  loadOrders();
  setInterval(function(){ loadOrders(true); }, 10000);
  document.addEventListener('langChange', function(){ emptyTexts.open=I18N.t('tradeNoOpenOrders'); emptyTexts.position=I18N.t('tradeNoPositions'); emptyTexts.history=I18N.t('tradeNoHistory'); renderOrders(); });

  document.addEventListener('marketTick', function(){
    var c = BTCBOX.markets.find(function(m){return m.sym===coin.sym;});
    if(!c) return;
    initPrice = c.price;
    // K线动态更新：最新价更新最后一根蜡烛
    if(typeof klineData!=='undefined' && klineData && klineData.length>0){
      var lastK=klineData[klineData.length-1]; lastK[1]=c.price;
      if(c.price>lastK[2]) lastK[2]=c.price;
      if(c.price<lastK[3]) lastK[3]=c.price;
      if(drawerOpen) requestAnimationFrame(drawKlineNow);
    }
    document.getElementById('curPrice').textContent = BTCBOX.fmtPrice(c.price);
    document.getElementById('midPrice').textContent = BTCBOX.fmtPrice(c.price);
    document.getElementById('midUnit').textContent = 'USDT';
    var u = c.chg >= 0;
    document.getElementById('curPrice').className = 'cur num ' + (u?'text-up':'text-down');
    document.getElementById('midPrice').className = 'mid-price num ' + (u?'text-up':'text-down');
    document.getElementById('curChg').textContent = (u?'+':'') + c.chg.toFixed(2) + '%';
    document.getElementById('curChg').style.color = u ? 'var(--up)' : 'var(--down)';
    if(c.high) document.getElementById('high24').textContent = BTCBOX.fmtPrice(c.high);
    if(c.low) document.getElementById('low24').textContent = BTCBOX.fmtPrice(c.low);
    if(c.vol) document.getElementById('vol24').textContent = c.vol;
    if(!priceInput.dataset.touched && mode==='limit'){ priceInput.value = c.price; recalc(); }
    renderOB();
  });
})();
</script>
</body>
</html>
