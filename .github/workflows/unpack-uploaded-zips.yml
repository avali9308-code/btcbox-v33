name: Unpack uploaded source archives

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source archives into requested folders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          mappings = {
              "admin-panel-main.zip": "admin-panel",
              "web-app-main.zip": "web-app",
              "opendax-2-6-stable.zip": "opendax",
              "btcboxcdt-phase2-fixed.zip": "backend",
          }

          root = Path.cwd()
          for archive_name, target_name in mappings.items():
              archive = root / archive_name
              if not archive.is_file():
                  raise SystemExit(f"Required archive is missing: {archive_name}")

              target = root / target_name
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True)

              with ZipFile(archive) as zf:
                  names = [n for n in zf.namelist() if n and not n.endswith("/")]
                  first_parts = {n.replace("\\", "/").split("/", 1)[0] for n in names}
                  strip_prefix = None
                  if len(first_parts) == 1:
                      candidate = next(iter(first_parts))
                      if all(n.replace("\\", "/").startswith(candidate + "/") for n in names):
                          strip_prefix = candidate + "/"

                  for info in zf.infolist():
                      raw = info.filename.replace("\\", "/")
                      if not raw:
                          continue
                      if strip_prefix:
                          if raw == strip_prefix.rstrip("/"):
                              continue
                          if not raw.startswith(strip_prefix):
                              continue
                          raw = raw[len(strip_prefix):]
                      if not raw:
                          continue
                      relative = Path(raw)
                      if relative.is_absolute() or ".." in relative.parts:
                          raise SystemExit(f"Unsafe archive path in {archive_name}: {info.filename}")
                      destination = (target / relative).resolve()
                      if target.resolve() not in destination.parents and destination != target.resolve():
                          raise SystemExit(f"Unsafe archive path in {archive_name}: {info.filename}")
                      if info.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info) as src, destination.open("wb") as dst:
                              shutil.copyfileobj(src, dst)

              count = sum(1 for p in target.rglob("*") if p.is_file())
              print(f"{archive_name} -> {target_name}/ ({count} files)")

          PY

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-panel web-app opendax backend
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract uploaded source archives [skip ci]"
            git push origin HEAD:main
          fi
