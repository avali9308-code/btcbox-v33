      <div class="seg">
        <button class="seg-btn active-buy" id="qtBuy" data-i18n="buy">买入</button>

      </div>
      <div class="input-wrap">
        <span class="input-label" data-i18n="amount">数量</span>

        </div>
      </div>

        <span><span data-i18n="available">可用</span> <span class="num" id="qtAvail">0.00</span> USDT</span>
        <span><span data-i18n="total">合计</span> <span class="num" id="qtTotal" style="color:var(--text-2);font-weight:600;">--</span> USDT</span>
      </div>

      <a class="func-item" href="pages/orders.html"><div class="func-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></div><span class="func-name" data-i18n="orders">订单</span></a>

<script src="assets/js/market-api.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  var curTab = 'hot';
  var firstRender = true;
  function renderAll(){
    if(firstRender){
      BTCBOX.renderTopCoins('topCoins', 4);
      BTCBOX.renderMarketList('marketList', curTab, 8);
      firstRender = false;
    } else {
      // 增量更新：只刷新价格数字，不重建 DOM，减少重绘卡顿
      BTCBOX.updateTopCoinsInPlace('topCoins');
      BTCBOX.updateMarketListInPlace('marketList');
    }
    var btc = BTCBOX.markets && BTCBOX.markets.find(function(m){return m.sym==='BTC';});
    if(btc && btc.price){ document.getElementById('qtPrice').textContent = BTCBOX.fmtPrice(btc.price); qtRecalc(); }
  }
  renderAll();
  document.addEventListener('marketTick', renderAll);
  // 加载真实可用余额
  function loadRealAvail(){
    if(!BTCBOX.isLoggedIn()) return;
    fetch('/api/account', {credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j.ok && j.balances && j.balances.USDT){
          document.getElementById('qtAvail').textContent = BTCBOX.fmtNum(j.balances.USDT.amount);
        }
      }).catch(function(){});
  }
  loadRealAvail();
  document.addEventListener('accountChange', loadRealAvail);
  BTCBOX.initAuthUI();
  BTCBOX.initChatBadge();

  // tab 切换
  document.querySelectorAll('#marketTabs .tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('#marketTabs .tab').forEach(function(x){x.classList.remove('active');});
      t.classList.add('active'); curTab = t.getAttribute('data-tab');
      firstRender = true; // tab 切换后需全量重建列表顺序
      BTCBOX.renderMarketList('marketList', curTab, 8);
      firstRender = false;
    });
  });

  // 快速交易
  var side = 'buy';
  var qtAmount = document.getElementById('qtAmount');
  var qtPrice = document.getElementById('qtPrice');
  function qtRecalc(){
    if(!qtPrice || !qtAmount) return;
    var p = parseFloat(qtPrice.textContent.replace(/,/g,'')) || 0;
    var a = parseFloat(qtAmount.value) || 0;
    document.getElementById('qtTotal').textContent = BTCBOX.fmtNum(p*a);
  }
  qtAmount.addEventListener('input', qtRecalc);
  document.getElementById('qtBuy').addEventListener('click', function(){
    side='buy'; this.classList.add('active-buy');
    document.getElementById('qtSell').classList.remove('active-sell');
    var btn = document.getElementById('qtConfirm');
    btn.className = 'btn btn-up'; btn.textContent = '确认买入';
  });
  document.getElementById('qtSell').addEventListener('click', function(){
    side='sell'; this.classList.add('active-sell');
    document.getElementById('qtBuy').classList.remove('active-buy');
    var btn = document.getElementById('qtConfirm');
    btn.className = 'btn btn-down'; btn.textContent = '确认卖出';
  });
  document.getElementById('qtConfirm').addEventListener('click', function(){
    if(!BTCBOX.isLoggedIn()){ BTCBOX.requireLogin(); return; }
    var btn = this; btn.classList.add('is-loading');
    var a = parseFloat(qtAmount.value)||0;
    var p = parseFloat(qtPrice.textContent.replace(/,/g,''))||0;
    fetch('/api/order', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({side:side, symbol:'BTCUSDT', order_type:'market', price:0, qty:a})
    }).then(function(r){return r.json();}).then(function(res){
      btn.classList.remove('is-loading');
      if(res.ok){ BTCBOX.toast(res.msg, 'success'); if(typeof loadRealAvail==='function') loadRealAvail(); }
      else { BTCBOX.toast(res.msg || '下单失败', 'error'); }
    }).catch(function(){
      btn.classList.remove('is-loading');
      BTCBOX.toast('网络错误，请重试', 'error');
    });
  });
})();
</script>

  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

</a>
